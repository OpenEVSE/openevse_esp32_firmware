# ───────────────────────── host-side native/simulator envs ─────────────────
# Merged into platformio.ini via [platformio] extra_configs. These build and
# run on the host (platform = native), not on real ESP32 hardware, and
# reference [common]/${core3_tsdb_common...} from platformio.ini.

# ───────────────────────── host-side unit test harness ─────────────────────
# Runs pure, framework-free logic on the build host. Run with: pio test -e native_test
# Feature PRs add their own doctest suites under test/; this env just hosts them.
# home_battery.cpp is a pure store, so it is compiled into the suites that need it
# (the smoke test is dependency-free and tolerates the extra object).
[env:native_test]
platform = native
framework =
test_framework = doctest
test_build_src = true
build_src_filter = -<*> +<tsdb_sample.cpp> +<home_battery.cpp> +<lvgl_tft/backlight.cpp> +<loadsharing_algorithm.cpp> +<crypto/sha256.c> +<crypto/hmac_sha256.cpp> +<web_auth.cpp> +<ota_url_allow.cpp> +<http_etag.cpp> +<fault_text.cpp> +<charge_threshold.cpp> +<notifications_rules.cpp> +<notifications_acks.cpp>
build_flags =
  -std=gnu++17
  -I src/lvgl_tft
  -I src
  -I $PROJECT_LIBDEPS_DIR/$PIOENV/EpoxyDuino/cores/epoxy
  -I $PROJECT_LIBDEPS_DIR/$PIOENV/EpoxyDuino/libraries/EpoxyMockWiFi
  -include ${PROJECT_DIR}/divert_sim/sim_platformio_compat.h
  -D ARDUINO=100
  -D ESP32
  -D ARDUINO_ARCH_ESP32
  -D USE_ESP32
  -D UNIX_HOST_DUINO
  -D EPOXY_DUINO
  -D EPOXY_CORE_ESP8266
  -D ARDUINOJSON_ENABLE_PROGMEM=0
lib_deps =
  bblanchon/ArduinoJson@6.20.1
  jeremypoulter/Micro Debug@0.0.5
  jeremypoulter/StreamSpy@0.0.2
  https://github.com/jeremypoulter/EpoxyDuino.git
lib_ignore = EpoxymDNS
extra_scripts =

[env:native_openevse]
platform = native
framework =
lib_deps =
  ${common.lib_deps}
  https://github.com/jeremypoulter/EpoxyDuino.git
  EpoxyFS
  EpoxyEepromEsp
  EpoxyMockWiFi
  EpoxymDNS
lib_extra_dirs = $PROJECT_LIBDEPS_DIR/$PIOENV/EpoxyDuino/libraries
build_flags =
  -std=c++14
  ${common.debug_flags}
  ${common.feature_flags}
  -fpermissive
  -Wno-narrowing
  -I $PROJECT_LIBDEPS_DIR/$PIOENV/EpoxyDuino/cores/epoxy
  -I $PROJECT_LIBDEPS_DIR/$PIOENV/EpoxyDuino/libraries/EpoxyMockWiFi
  -D ARDUINO=100
  -D ESP32
  -D ARDUINO_ARCH_ESP32
  -D USE_ESP32
  -D EPOXY_DUINO
  -D EPOXY_CORE_ESP32
  -D CS_PLATFORM=CS_P_UNIX
  -D MO_USE_FILEAPI=POSIX_FILEAPI
  -D FORMAT_LITTLEFS_IF_FAILED=
  -D HTTP_SERVER_PORT=8000
  -D HTTPS_SERVER_PORT=8443
  -D CERT_VALIDATOR_OPENSSL
  -D WIFI_BUTTON_PRESSED_STATE=HIGH
  -D DISABLE_HEARTBEAT
  -lssl
  -lcrypto
  -lpthread
  -lavahi-client
  -lavahi-common
build_type = debug
lib_compat_mode = off

[env:native_openevse_lvgl]
extends = env:native_openevse
lib_deps =
  ${env:native_openevse.lib_deps}
  ${common.lvgl_lib}
lib_extra_dirs = $PROJECT_LIBDEPS_DIR/$PIOENV/EpoxyDuino/libraries
build_flags =
  ${env:native_openevse.build_flags}
  ${common.lvgl_tft_renderer_flags}
  -I $PROJECT_LIBDEPS_DIR/$PIOENV/EpoxyDuino/cores/epoxy
  -I $PROJECT_LIBDEPS_DIR/$PIOENV/EpoxyDuino/libraries/EpoxyMockWiFi
  -D LCD_BACKLIGHT_PIN=0
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -ldl

# divert_sim host binary (scenario runner): pio run -e native_simulator
[env:native_simulator]
platform = native
framework =
lib_deps =
  bblanchon/ArduinoJson@6.20.1
  jeremypoulter/Micro Debug@0.0.5
  jeremypoulter/ConfigJson@0.0.8
  openevse/OpenEVSE@0.0.24
  jeremypoulter/ESPAL@0.0.7
  jeremypoulter/StreamSpy@0.0.2
  jeremypoulter/MicroTasks@0.0.4
  https://github.com/jeremypoulter/EpoxyDuino.git
  EpoxyFS
  EpoxyEepromEsp
lib_extra_dirs = $PROJECT_LIBDEPS_DIR/$PIOENV/EpoxyDuino/libraries
build_flags =
  -std=c++14
  -fpermissive
  -Wno-narrowing
  -pthread
  -I $PROJECT_LIBDEPS_DIR/$PIOENV/EpoxyDuino/cores/epoxy
  -I $PROJECT_LIBDEPS_DIR/$PIOENV/EpoxyDuino/libraries/EpoxyMockWiFi
  -include ${PROJECT_DIR}/divert_sim/sim_platformio_compat.h
  -D DIVERT_SIM
  -D ARDUINO=100
  -D ESP32
  -D ARDUINO_ARCH_ESP32
  -D USE_ESP32
  -D UNIX_HOST_DUINO
  -D EPOXY_DUINO
  -D EPOXY_CORE_ESP8266
  -D ENERGY_METER_STORE_STATE=0
  -D ARDUINOJSON_ENABLE_PROGMEM=0
  -D ENABLE_CONFIG_V1_IMPORT=0
  -D ENABLE_CONFIG_CHANGE_NOTIFICATION=0
build_src_filter =
  -<*>
  +<../divert_sim/divert_sim.cpp>
  +<../divert_sim/RapiSender.cpp>
  +<../divert_sim/sim/*.cpp>
  +<app_config.cpp>
  +<web_auth_secret.cpp>
  +<current_shaper.cpp>
  +<debug.cpp>
  +<divert.cpp>
  +<energy_meter.cpp>
  +<evse_man.cpp>
  +<evse_monitor.cpp>
  +<event_log.cpp>
  +<input_filter.cpp>
  +<loadsharing_algorithm.cpp>
  +<manual.cpp>
  +<limit.cpp>
  +<charge_threshold.cpp>
  +<boost.cpp>
lib_ignore =
  EpoxymDNS
  ArduinoMongoose
lib_compat_mode = off
