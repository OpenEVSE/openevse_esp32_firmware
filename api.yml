      description: Drops and re-establishes the connection to the broker.
      tags:
        - MQTT
      responses:
        '200':
          $ref: '#/components/responses/UpdateSuccessful'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /relay/reset:
    get:
      operationId: resetRelayHealth
      summary: Reset the relay contact-life estimate
      description: |
        Use after a physical relay replacement so wear from the old relay is not
        carried over. Requires the controller's relay health feature. Also
        accepts `POST`. A `GET` must send `X-Requested-With: OpenEVSE`.
      tags:
        - Relay
      responses:
        '200':
          $ref: '#/components/responses/UpdateSuccessful'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: The controller rejected the command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                Error:
                  value:
                    msg: error
  /relay/recovery:
    get:
      operationId: runRelayRecovery
      summary: Run the stuck-relay recovery cycle
      description: |
        Requires controller firmware 9.3.0+. The controller rejects the command
        if an EV is connected. The response is deferred until the cycle finishes,
        which can take up to about 30 seconds. Also accepts `POST`. A `GET` must
        send `X-Requested-With: OpenEVSE`.
      tags:
        - Relay
      responses:
        '200':
          $ref: '#/components/responses/UpdateSuccessful'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: The controller rejected the command, for example an EV is connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                Error:
                  value:
                    msg: error
  /cabletemp:
    get:
      operationId: getCableTemperatures
      summary: Get the cable thermistor readings and configuration
      description: |
        Four logical sources: `ev1`/`ev2` on the EV cable and `in1`/`in2` on the
        input cable. Requires controller firmware 9.4.0+. The live readings are
        also included in `/status`.
      tags:
        - Cable Temperature
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  supported:
                    type: boolean
                  enabled:
                    type: boolean
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: integer
                          minimum: 0
                          maximum: 3
                        name:
                          type: string
                          enum:
                            - ev1
                            - ev2
                            - in1
                            - in2
                        pin:
                          type: integer
                          minimum: 0
                          maximum: 2
                        status:
                          type: integer
                          description: '`0` ok, `1` not installed or unassigned, `2` open circuit, `3` shorted'
                        temperature:
                          type: number
                          description: Omitted when there is no reading, so it is never confused with 0 C
                        r25:
                          type: integer
                        beta:
                          type: integer
                        offset_c10:
                          type: integer
                        panic_c10:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: setCableTemperatureSource
      summary: Assign a pin and optionally set the thermistor parameters
      description: |
        Omitting the calibration fields reassigns the pin only. `r25`, `beta`,
        `offset_c10` and `panic_c10` must be supplied together. Ranges are
        enforced by the controller. Assigning a source to pin `1` (PP_READ) makes
        the controller turn PP auto-ampacity off.
      tags:
        - Cable Temperature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source
                - pin
              properties:
                source:
                  type: integer
                  minimum: 0
                  maximum: 3
                pin:
                  type: integer
                  minimum: 0
                  maximum: 2
                r25:
                  type: integer
                beta:
                  type: integer
                offset_c10:
                  type: integer
                panic_c10:
                  type: integer
      responses:
        '200':
          $ref: '#/components/responses/UpdateSuccessful'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: The controller rejected the values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /claims/target:
    get:
      operationId: getClaimsTarget
      summary: Get the resolved target state
      description: >-
        The properties that are currently in effect after all
        [claims](#tag/Claims) have been resolved, and which client holds each one.
      tags:
        - Claims
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  properties:
                    type: object
                    description: The effective properties
                  claims:
                    type: object
                    description: The client id that owns each of `state`, `charge_current` and `max_current`
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /energy/raw:
    get:
      operationId: getEnergyRaw
      summary: Raw energy log samples
      description: |
        Recent samples at the logging interval. Builds with the time series
        database return the last three hours, wrapped as `{"samples": [...]}`;
        `before` pages back one window at a time.
      tags:
        - Energy
      parameters:
        - in: query
          name: max
          schema:
            type: integer
          description: Return at most this many samples
        - in: query
          name: before
          schema:
            type: integer
          description: Epoch seconds. Return the window immediately before this time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  samples:
                    type: array
                    items:
                      type: object
                      properties:
                        ts:
                          type: integer
                          description: Epoch seconds
                        a:
                          type: number
                          description: Current (A)
                        t:
                          type: number
                          description: Temperature (C)
                        e:
                          type: number
                          description: Session energy
                        s:
                          type: integer
                          description: State of charge, `-1` when unknown
                        v:
                          type: number
                          description: Voltage (V), time series builds only
                        p:
                          type: number
                          description: Power (W), time series builds only
                        pilot:
                          type: number
                          description: Pilot current (A), time series builds only
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /energy/daily:
    get:
      operationId: getEnergyDaily
      summary: Daily energy totals
      description: |
        Time series builds take `days` (1-365, default 30). Other builds take `year` and
        `quarter` (`1`-`4`).
      tags:
        - Energy
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
        - in: query
          name: year
          schema:
            type: integer
            minimum: 2020
            maximum: 2100
        - in: query
          name: quarter
          schema:
            type: integer
            minimum: 1
            maximum: 4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  daily:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnergyBucketDate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /energy/weekly:
    get:
      operationId: getEnergyWeekly
      summary: Weekly energy totals
      description: Only available in builds with the time series database.
      tags:
        - Energy
      parameters:
        - in: query
          name: weeks
          schema:
            type: integer
            minimum: 1
            maximum: 104
            default: 12
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  weekly:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnergyBucketDate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /energy/monthly:
    get:
      operationId: getEnergyMonthly
      summary: Monthly energy totals
      description: Totals per month for one year, defaulting to the current year.
      tags:
        - Energy
      parameters:
        - in: query
          name: year
          schema:
            type: integer
            minimum: 2020
            maximum: 2100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  monthly:
                    type: array
                    items:
                      type: object
                      properties:
                        mo:
                          type: string
                          description: Month
                        pk:
                          type: number
                          description: Peak temperature (C)
                        mn:
                          type: number
                          description: Minimum temperature (C)
                        en:
                          type: number
                          description: Energy (kWh)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /energy/annual:
    get:
      operationId: getEnergyAnnual
      summary: Annual energy totals
      description: Totals per year.
      tags:
        - Energy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  annual:
                    type: array
                    items:
                      type: object
                      properties:
                        yr:
                          type: integer
                        pk:
                          type: number
                          description: Peak temperature (C)
                        mn:
                          type: number
                          description: Minimum temperature (C)
                        en:
                          type: number
                          description: Energy (kWh)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /update:
    post:
      operationId: updateFirmware
      summary: Update the firmware
      description: |
        Either upload the firmware image as a multipart form, or send a JSON body
        naming a URL for the device to fetch it from (answered with
        `{"msg": "started"}`; progress is reported over `/ws`). `GET` is not
        supported and returns `405`.
      tags:
        - Firmware Update
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                firmware:
                  type: string
                  format: binary
                  description: The firmware image; the part name is not significant
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: Location of the firmware image to fetch
      responses:
        '200':
          $ref: '#/components/responses/UpdateSuccessful'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          description: Only `POST` is accepted
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: The update failed
  /migrate/status:
    get:
      operationId: getMigrateStatus
      summary: Flash migration progress and diagnostics
      description: >-
        State of an in-place 16MB repartition. Progress is also pushed over `/ws`.
        On builds without migration support it returns `{"active": false}`.
      tags:
        - Diagnostics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                  state:
                    type: string
                    enum:
                      - idle
                      - manifest
                      - app
                      - migrator
                  conn_open:
                    type: boolean
                  awaiting:
                    type: boolean
                  body_complete:
                    type: boolean
                  has_redirect:
                    type: boolean
                  has_pending:
                    type: boolean
                  dl_pos:
                    type: integer
                  dl_total:
                    type: integer
                  app_off:
                    type: integer
                  failed:
                    type: boolean
                  fail_code:
                    type: integer
                  fail_where:
                    type: string
                  free_heap:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /migrate/coredump:
    get:
      operationId: getMigrateCoredump
      summary: Summary of the last panic, as seen by the migrator
      description: Decoded summary of the last panic, read by the flash migration code.
      tags:
        - Diagnostics
      responses:
        '200':
          description: >-
            `task`, `pc`, `bt` and `corrupted` when a core dump exists, otherwise
            `coredump` set to `none` (or `n/a` on unsupported builds).
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /migrate/expand16mb:
    post:
      operationId: expandTo16mb
      summary: Repartition a 16MB module that was flashed with the 4MB layout
      description: Starts the migration; progress is available from `/migrate/status` and `/ws`.
      tags:
        - Diagnostics
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: Release manifest to use instead of the default
                dry_run:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Migration started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                Started:
                  value:
                    msg: started
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          description: Only `POST` is accepted
        '409':
          description: A migration is already in progress
        '412':
          description: This device is not eligible for the migration
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: The migration could not be started
  /debug:
    get:
      operationId: getDebugLog
      summary: Buffered debug log
      description: The recent debug output of the WiFi module. Allows any CORS origin.
      tags:
        - Diagnostics
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /debug/console:
    get:
      operationId: debugConsole
      summary: Live debug console
      description: >-
        WebSocket that streams the debug output as text frames. The upgrade request
        is authenticated like any other.
      tags:
        - Diagnostics
      responses:
        '101':
          description: Switching protocols
        '401':
          $ref: '#/components/responses/Unauthorized'
  /debug/crash:
    get:
      operationId: getCrashSummary
      summary: Decoded summary of the last panic
      description: >-
        A core dump survives a reboot in flash. `present` is `false` when there is
        none. The remaining keys depend on the CPU architecture.
      tags:
        - Diagnostics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  present:
                    type: boolean
                  size:
                    type: integer
                  addr:
                    type: integer
                  valid:
                    type: boolean
                  task:
                    type: string
                  pc:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: clearCrashSummary
      summary: Clear the stored core dump
      description: Clears the stored core dump so the next panic is unambiguous.
      tags:
        - Diagnostics
      responses:
        '200':
          description: Erased
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                Erased:
                  value:
                    msg: erased
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: The core dump could not be erased
  /debug/crash/raw:
    get:
      operationId: getCrashImage
      summary: Download the raw core dump
      description: >-
        For use with `esp-coredump`. Unlike other operations this one always
        answers an unauthenticated request with a `WWW-Authenticate` Basic
        challenge (never the JSON `401`), and is not subject to the throttle.
      tags:
        - Diagnostics
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Credentials are required, answered with a `WWW-Authenticate` challenge
        '404':
          description: There is no core dump
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /debug/crash/report:
    get:
      operationId: getCrashReport
      summary: The crash report, in the form the broker accepts
      description: |
        Part of the crash report upload: the browser fetches this and POSTs it to
        the broker itself, so the charger needs no internet access. Only present
        in builds with crash upload enabled. The report carries the reporter id
        and a hash of the delete key, so a reporter identity must exist first,
        see `/debug/crash/identity`.
      tags:
        - Diagnostics
      responses:
        '200':
          description: The report, exactly as the broker takes it
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: There is no stored crash dump
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '409':
          description: No reporter identity has been stored yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: The report is too large to build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /debug/crash/identity:
    get:
      operationId: getCrashIdentity
      summary: The reporter identity and broker URL
      description: |
        Only present in builds with crash upload enabled. Every method on this
        route is for the web app only: it must send `X-Requested-With: OpenEVSE`
        even with no password set, because the delete key is what erases this
        charger's reports. The delete key is only returned when `key=1` is
        requested.
      tags:
        - Diagnostics
      parameters:
        - in: query
          name: key
          required: false
          schema:
            type: integer
            enum:
              - 1
          description: Also return the delete key
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reporter_id:
                    type: string
                    nullable: true
                    description: Null when no identity has been stored
                  delete_key:
                    type: string
                    description: Only present when `key=1` was requested
                  broker:
                    type: string
                    description: URL of the crash report broker
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: storeCrashIdentity
      summary: Store the reporter identity generated by the browser
      description: Only present in builds with crash upload enabled.
      tags:
        - Diagnostics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reporter_id
                - delete_key
              properties:
                reporter_id:
                  type: string
                delete_key:
                  type: string
      responses:
        '200':
          description: Stored, or the same identity was already stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                Stored:
                  value:
                    msg: stored
        '400':
          description: Invalid JSON, reporter id or delete key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A different identity is already stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: The identity could not be stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
    delete:
      operationId: forgetCrashIdentity
      summary: Forget the reporter identity
      description: >-
        Only present in builds with crash upload enabled. Call this once the
        reports have been erased at the broker.
      tags:
        - Diagnostics
      responses:
        '200':
          description: Forgotten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                Forgotten:
                  value:
                    msg: forgotten
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: The identity could not be removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /evse:
    get:
      operationId: getEvseSerialLog
      summary: Buffered serial traffic with the EVSE controller
      description: Allows any CORS origin.
      tags:
        - Diagnostics
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /evse/console:
    get:
      operationId: evseConsole
      summary: Live EVSE serial console
      description: >-
        WebSocket that streams the serial traffic to and from the EVSE controller
        as text frames. The upgrade request is authenticated like any other.
      tags:
        - Diagnostics
      responses:
        '101':
          description: Switching protocols
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: Admin username and password, sent on every request.
    SessionCookie:
      type: apiKey
      in: cookie
      name: oevse_session
      description: >-
        Session cookie issued by `POST /login`. State-changing requests that use
        it must also send `X-Requested-With: OpenEVSE`.
  schemas:
    EnergyBucketDate:
      type: object
      properties:
        dt:
          type: string
          format: date
          description: First day of the bucket
        pk:
          type: number
          description: Peak temperature (C)
        mn:
          type: number
          description: Minimum temperature (C)
        en:
          type: number
          description: Energy (Wh)
    Message:
      title: Informational message
      type: object
      properties:
        msg:
          type: string
          description: The message
    Day:
      type: string
      enum:
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
        - saturday
        - sunday
      x-examples: {}
    ScheduleEvent:
      type: object
      properties:
        id:
          type: integer
          example: 1
        state:
          $ref: ./models/EvseState.yaml
        time:
          type: string
          format: time
        days:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Day'
      required:
        - state
        - time
        - days
      title: ''
    LogEvent:
      title: LogEvent
      type: object
      x-examples:
        example-1:
          value:
            time: '2021-08-24T14:15:22Z'
            type: information
            managerState: active
            evseState: 1
            evseFlags: 123
            pilotState: 2
            changed:
              - pilot
            pilot: 32
            energy: 1234.5
            elapsed: 123456
            temperature: 35.4
            tempuratureMax: 50.4
            divertMode: 1
      properties:
        time:
          type: string
          format: date-time
          readOnly: true
        type:
          type: string
          enum:
            - information
            - notification
            - warning
        managerState:
          $ref: ./models/EvseState.yaml
        evseState:
          type: integer
          minimum: 0
          maximum: 255
        evseFlags:
          type: integer
          format: int32
        pilotState:
          description: >-
            J1772 pilot state at the time of the event. 255 for entries written
            before this field was recorded.
          type: integer
          minimum: 0
          maximum: 255
        changed:
          description: >-
            Which fields differ from the previous entry, i.e. why this entry
            exists. "flags" covers only the meaningful evseFlags bits: the
            session-timing and previous-EV-connected bookkeeping bits are
            recorded in evseFlags but never create an entry of their own. "boot" means there was no previous entry to compare
            against; "periodic" means nothing visible changed and the entry is
            the periodic sample of an unchanging state; "notification" means
            the advisory id differs from the previous entry's. Empty for
            entries written before this field was recorded. The pilot state is
            never listed: it is recorded, but a change in it alone does not
            create an entry.
          type: array
          items:
            type: string
            enum:
              - boot
              - type
              - manager
              - state
              - flags
              - pilot
              - divert
              - shaper
              - periodic
              - notification
        pilot:
          type: integer
          format: int32
          minimum: 0
        energy:
          type: number
          format: double
          minimum: 0
        elapsed:
          type: integer
          format: int32
          minimum: 0
        temperature:
          type: number
          format: double
        tempuratureMax:
          type: number
          format: double
        divertMode:
          type: integer
          format: int32
          minimum: 1
          maximum: 2
          exclusiveMaximum: false
        rfidTag:
          description: >-
            RFID tag UID authenticated for this session, when RFID was used.
            Absent for entries with no RFID authentication or written before
            this field was recorded.
          type: string
        notification:
          description: >-
            For a "notification" entry, the advisory id that was raised (e.g.
            safety.ground_check). Empty for every other entry type and for
            entries written before this field existed. A row is written on the
            raise edge only, at most once per advisory id per boot.
          type: string

    LoadSharingPeerStatus:
      type: object
      description: Minimal peer status snapshot used for load sharing decisions.
      properties:
        amp:
          type: number
          format: double
          description: Measured current (amps).
        voltage:
          type: number
          format: double
          description: Measured voltage (volts).
        pilot:
          type: number
          format: double
          description: Current pilot setpoint (amps).
        vehicle:
          type: integer
          description: 1 if vehicle connected, else 0.
        state:
          type: integer
          description: EVSE state code.
        min_current:
          type: number
          format: double
          description: EVSE minimum current (amps).
        max_current:
          type: number
          format: double
          description: EVSE configured maximum current (amps).
        priority:
          type: integer
          description: Node-local load sharing priority; lower values win under scarcity.

    LoadSharingPeer:
      type: object
      description: A discovered or configured peer.
      properties:
        id:
          type: string
          description: Stable device id.
        name:
          type: string
          description: mDNS instance/hostname if available.
        host:
          type: string
          description: Hostname or IP address used to reach the peer.
        ip:
          type: string
          description: Current resolved IP address.
        version:
          type: string
          description: Firmware version if available.
        online:
          type: boolean
        joined:
          type: boolean
          description: True if this peer is joined to the load sharing group (manually configured).
        last_seen:
          type: integer
          description: Seconds since boot when the peer was last seen (millis/1000).
        status:
          $ref: '#/components/schemas/LoadSharingPeerStatus'

    LoadSharingAllocation:
      type: object
      description: Per-member current allocation result.
      properties:
        id:
          type: string
          description: Member id.
        target_current:
          type: number
          format: double
          minimum: 0
          description: Allocated current (amps).
        reason:
          type: string
          enum:
            - idle
            - equal_share
            - connected_min
            - min_subset
            - insufficient
            - offline
            - failsafe_disabled
          description: Why this allocation was computed.
      required:
        - target_current

    LoadSharingStatus:
      type: object
      description: Runtime status for local load sharing.
      properties:
        enabled:
          type: boolean
        group_id:
          type: string
        computed_at:
          type: string
          format: date-time
        failsafe_active:
          type: boolean
        online_count:
          type: integer
        offline_count:
          type: integer
        peers:
          type: array
          items:
            $ref: '#/components/schemas/LoadSharingPeer'
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/LoadSharingAllocation'
  responses:
    UpdateSuccessful:
      description: Update successful
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          examples:
            Success message:
              value:
                msg: done
    NotFound:
      description: Example response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          examples:
            Not found:
              value:
                msg: Not found
    Unauthorized:
      description: >-
        Authentication is required and no valid credentials were supplied.
        Requests with `X-Requested-With: OpenEVSE` get a JSON body; others get a
        `WWW-Authenticate` Basic challenge.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          examples:
            Auth required:
              value:
                msg: auth
    TooManyRequests:
      description: >-
        A wrong password was presented while the brute-force throttle is active.
        Correct credentials are never throttled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          examples:
            Locked:
              value:
                msg: locked
    Forbidden:
      description: >-
        Rejected by the CSRF guard. A state-changing request authenticated by
        session cookie, or a `GET` to an operation that changes state, is missing
        `X-Requested-With: OpenEVSE`. Session-cookie requests get the JSON body;
        `GET` actuators get plain text.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          examples:
            CSRF:
              value:
                msg: csrf
        text/plain:
          schema:
            type: string
            example: 'Forbidden: use POST or the app'
    BadRequest:
      description: Example response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          examples:
            Bad JSON:
              value:
                msg: Could not parse JSON
  parameters: {}
