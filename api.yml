      summary: Send a RAPI command to the EVSE controller
      description: |
        Sends an arbitrary RAPI command and returns the controller's reply. `/r`
        is an alias. Without the `rapi` parameter it returns an HTML test page
        (or an empty body when `json=1`). Because a RAPI command can change
        anything on the controller, a `GET` with `rapi` must send
        `X-Requested-With: OpenEVSE`; `POST` is also accepted.

        Some commands are blocked by the firmware.
      tags:
        - RAPI
      parameters:
        - in: query
          name: rapi
          required: false
          schema:
            type: string
            example: $GS
