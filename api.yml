                    type: string
                  ret:
                    type: string
            text/html:
              schema:
                type: string
        '400':
          description: >-
            The command is blocked by the firmware. With `json=1` the body is
            `{"cmd": ..., "error": ...}`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: >-
