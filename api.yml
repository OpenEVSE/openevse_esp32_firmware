  /time:
    get:
      summary: Get the time
      tags:
        - Time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  time:
                    type: string
                    x-stoplight:
                      id: 6q0laeyxt5u85
                    description: The time in UTC according to the OpenEVSE.
                    format: date-time
                  offset:
                    type: string
                    x-stoplight:
                      id: u5zngl88caktf
                    pattern: '^[+-][0-9]{4}$'
                  local_time:
                    type: string
                    x-stoplight:
                      id: 7h1cpgfjj5j9j
                    format: date-time
