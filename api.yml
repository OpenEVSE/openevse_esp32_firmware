openapi: 3.0.3
info:
  title: OpenEVSE WiFi API
  description: |
    The API for the OpenEVSE WiFi module

    ## Authentication

    Authentication is only enforced when an admin password is configured. With no
    password set (or while the device is in AP-only provisioning mode) every
    operation is open and none of the credentials below are needed. When a password
    is set, every operation except `/login` and `/logout` requires **one** of:

    * **HTTP Basic** credentials (`Authorization` header) - intended for machine
      clients such as scripts and integrations. If the username is left blank in the
      configuration a default admin user is used.
    * A **session cookie** (`oevse_session`) obtained from [`POST /login`](#tag/Authentication)
      - intended for the browser UI. Sessions last 6 hours, or 30 days if `remember`
      was requested.

    ### Authentication failures

    | Status | Meaning |
    |---|---|
    | `401` | No valid credentials were supplied. Clients that send `X-Requested-With: OpenEVSE` get a JSON body `{"msg":"auth"}`; any other client gets a `WWW-Authenticate` Basic challenge so browsers prompt for credentials. |
    | `429` | A *wrong* Basic password, or a failed `/login`, was presented while the brute-force throttle is active (`{"msg":"locked"}`). Correct credentials are never throttled, and the counter decays on its own. Requests with no credentials at all still get `401`. |
    | `403` | CSRF guard: a state-changing (non-`GET`) request authenticated by session cookie must also send `X-Requested-With: OpenEVSE`. Basic-auth clients are unaffected. A few `GET` endpoints also require this header and are documented on the operation. |
  version: '1.0'
  contact:
    email: jeremy@bigjungle.net
    name: Jeremy Poulter
    url: 'https://github.com/jeremypoulter/'
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
servers:
  - url: '{server}'
    variables:
      server:
        default: 'http://openevse.local'
  - url: 'http://localhost:8080'
security:
  - {}
  - BasicAuth: []
  - SessionCookie: []
paths:
  /status:
    get:
      operationId: getStatus
      summary: Get the EVSE status
      description: |
        The status endpoint can be called to get the status of the EVSE.

        While it is posible to poll this endpoint, the recomendatoin is to retrieve the initial
        state then use the [/ws](#statusUpdates)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./models/Status.yaml
              examples:
                EVSE Status:
                  value:
                    mode: STA
                    wifi_client_connected: 1
                    eth_connected: 0
                    net_connected: 1
                    srssi: -73
                    ipaddress: 192.168.1.43
                    emoncms_connected: 1
                    packets_sent: 22307
                    packets_success: 22290
                    mqtt_connected: 1
                    free_heap: 203268
                    comm_sent: 335139
                    comm_success: 335139
                    rapi_connected: 1
                    amp: 0
                    pilot: 32
                    max_current: 32
                    temp1: 282
                    temp2: -2560
                    temp3: -2560
                    state: 254
                    elapsed: 3473
                    session_energy: 25034
                    total_energy: 998
                    total_day: 23
                    total_week: 68
                    total_month: 126
                    total_year: 998
                    gfcicount: 0
                    nogndcount: 0
                    stuckcount: 0
                    divertmode: 1
                    solar: 390
                    grid_ie: 0
                    charge_rate: 7
                    divert_update: 0
                    ota_update: 0
                    time: '2020-05-12T17:53:48Z'
                    offset: '+0000'
      tags:
        - Status
    post:
      operationId: postStatus
      summary: Update external data to EVSE status
      description: |
        The status endpoint can be called to post external data that should be updated by MQTT
        If MQTT is not an option, all external data needed can be updated from an HTTP POST request to /status endpoint.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  voltage:
                    type: integer
                    description: live voltage in V
                  shaper_live_pwr:
                    type: integer
                    description: total household live power in W
                  solar:
                    type: integer
                    description: divert solar production in W
                  grid_ie:
                    type: integer
                    description: divert grid -import/+export in W
                  battery_level:
                    type: integer
                    description: vehicle soc in %
                  battery_range:
                    type: integer
                    description: vehicle range
                  time_to_full_charge:
                    type: integer
                    description: vehicle charge ETA
                x-examples:
                  EVSE Status:
                    voltage: 220
                    shaper_live_pwr: 3400
                    solar: 3000
                    grid_ie: 3000
                    battery_level: 85
                    battery_range: 230
                    time_to_full_charge: 1590
              examples:
                EVSE Status:
                  value:
                    voltage: 220
                    shaper_live_pwr: 3400
                    solar: 3000
                    grid_ie: 3000
                    battery_level: 85
                    battery_range: 230
                    time_to_full_charge: 1590
      tags:
        - Status
  /ws:
    get:
      operationId: statusUpdates
      summary: EVSE status updates
      description: |
        As the state changes on the EVSE a websocket frame will be sent over the socket.
        The frame will contain a JSON document conntaining only the updated state.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./models/Status.yaml
        '400':
          description: Error
      tags:
        - Status
  /config:
    get:
      operationId: getConfig
      summary: Get the EVSE configuration
      description: |
        Retrieve the current WiFi and EVSE module configuration
      tags:
        - Config
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./models/Config.yaml
              examples: {}
    post:
      description: |
        Update the EVSE configuration
      operationId: updateConfig
      responses:
        '200':
          $ref: '#/components/responses/UpdateSuccessful'
        '400':
          $ref: '#/components/responses/BadRequest'
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./models/Config.yaml
            examples:
              Update EmonCMS setting:
                value:
                  emoncms_enabled: true
                  emoncms_server: 'http://emoncms.org'
                  emoncms_node: openevse-a7d4
                  emoncms_apikey: emoncmskey
                  emoncms_fingerprint: ''
              Configure Solar divert:
                value:
                  divert_type: 0
                  divert_enabled: true
                  divert_attack_smoothing_time: 8
                  divert_decay_smoothing_time: 300
                  divert_min_charge_time: 20
              Set normal charging mode:
                value:
                  charge_mode: fast
              Set Eco mode:
                value:
                  charge_mode: eco
              Configure Tesla credentials:
                value:
                  tesla_enabled: true
                  tesla_access_token: qts-1234.......
                  tesla_refresh_token: abcd.......
                  tesla_created_at: 1623358948
                  tesla_expires_in: 3888000
              Select Tesla vehicle:
                value:
                  tesla_vehicle_id: '2238974987235987'
      summary: Update the EVSE configuration
      tags:
        - Config
  /override:
    description: Manual override can be used to override a charging timer or to immediately start a charge if the EVSE is in sleeping state.
    get:
      responses:
        '200':
          description: Manual overide is active
          content:
            application/json:
              schema:
                $ref: ./models/Properties.yaml
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getManualOverride
      tags:
        - Manual Override
      summary: Get the Manual Override status
      description: Returns the current state of the manual override.
    post:
      description: |
        Set the manual override
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./models/Properties.yaml
            examples:
              Force stop of charging:
                value:
                  state: disabled
              example-1:
                value:
                  state: active
                  charge_current: 0
                  max_current: 0
                  auto_release: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
      operationId: setManualOverride
      tags:
        - Manual Override
      summary: Set the manual override
    patch:
      description: Toggle the manual override
      responses:
        '200':
          description: OK
      operationId: toggleManualOverride
      tags:
        - Manual Override
      summary: Toggle the manual Override
    delete:
      description: Clears the manual override
      responses:
        '200':
          description: OK
      operationId: clearManualOverride
      tags:
        - Manual Override
      summary: Clear the manual override
  /claims:
    get:
      description: |
        List all claims made by EVSE clients.
        The response will be an array of EVSE claims.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./models/Claim.yaml
      operationId: listClaims
      tags:
        - Claims
      summary: List EVSE claims
  '/claims/{client}':
    get:
      description: |
        Get the claim information for a specific client.
        The response will be an EVSE claim.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./models/Properties.yaml
        '404':
          $ref: '#/components/responses/NotFound'
      parameters: []
      operationId: getClaim
      tags:
        - Claims
      summary: Get EVSE claim information
    post:
      description: Make/Update a claim
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./models/Properties.yaml
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: setClaim
      summary: Make/Update an EVSE claim
      tags:
        - Claims
    delete:
      description: Release a claim
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: releaseClaim
      summary: Release an EVSE claim
      tags:
        - Claims
    parameters:
      - schema:
          type: integer
        name: client
        in: path
        required: true
        description: 'The client ID, defined by [OpenEVSE](https://github.com/OpenEVSE/openevse_esp32_firmware/blob/master/src/evse_man.h#L28)'
  /schedule:
    get:
      summary: List schedule events
      description: This will get a complete list of events in the schedule
      responses:
        '200':
          description: List of the schedule events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: listSchedule
      tags:
        - Schedule
    post:
      operationId: updateSchedule
      description: Perform multiple event updates
      responses:
        '201':
          description: item created
        '400':
          description: 'invalid input, object invalid'
        '409':
          description: an existing item already exists
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ScheduleEvent'
            examples:
              Single event:
                value:
                  - id: 1
                    state: active
                    time: '14:15:22Z'
                    days:
                      - monday
              Daily Timer:
                value:
                  - id: 1
                    state: active
                    days:
                      - monday
                      - tuesday
                      - wednesday
                      - thursday
                      - friday
                      - saturday
                      - sunday
                    time: '07:00:00'
                  - id: 2
                    state: disabled
                    days:
                      - monday
                      - tuesday
                      - wednesday
                      - thursday
                      - friday
                      - saturday
                      - sunday
                    time: '10:00:00'
        description: Inventory item to add
      tags:
        - Schedule
      summary: Batch update schedule
  '/schedule/{id}':
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: Numeric ID of the event
    get:
      summary: Get event details
      description: |
        This will get the details of a specific event in the schedule.
        The response will be the EVSE state to set for that event.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./models/EvseState.yaml
      operationId: getScheduleEvent
      tags:
        - Schedule
    post:
      description: |
        Update the details of a specific event in the schedule.
      responses:
        '200':
          $ref: '#/components/responses/UpdateSuccessful'
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./models/EvseState.yaml
        description: ''
      operationId: setScheduleEvent
      tags:
        - Schedule
      summary: Update event details
    delete:
      description: |
        Remove a specific event from the schedule.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples: {}
      operationId: removeScheduleEvent
      tags:
        - Schedule
      summary: Remove event
  /schedule/plan:
    get:
      summary: Get planned events and state
      description: This will return the planned events by day and also the current state of the scheduler
      responses:
        '200':
          description: List of planed events
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_day:
                    $ref: '#/components/schemas/Day'
      operationId: getSchedulePlan
      tags:
        - Schedule
  /logs:
    get:
      summary: Get event block information
      tags:
        - Event Log
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  min:
                    type: integer
                  max:
                    type: integer
      operationId: getEventBlockInfo
      description: 'Retrieve the start and end indexes of the log event blocks. Each log event block contains '
      parameters: []
    parameters: []
  '/logs/{index}':
    get:
      summary: Get log block events
      tags:
        - Event Log
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEvent'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getEventBlock
      description: |
        Retrieve the log events for a specific block.
        The block index range is returned by the /logs endpoint.
    parameters:
      - schema:
          type: integer
        name: index
        in: path
        required: true
  /logs/export:
    get:
      summary: Export session history as CSV
      tags:
        - Event Log
      responses:
        '200':
          description: OK
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: exportEventLogCsv
      description: >-
        Stream every stored log entry as a CSV file (Time, Type, State, Energy
        (kWh), Elapsed (min), RFID Tag, User Name, Temperature (C)), one row
        per event. The RFID Tag and User Name columns are blank for sessions
        without RFID authentication.
      parameters: []
  /rfid/users:
    get:
      summary: List RFID user names
      tags:
        - RFID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                description: Map of RFID tag UID to the assigned user name.
      operationId: getRfidUsers
      description: Retrieve the UID → user name mapping used to attribute sessions in History and the CSV export.
      parameters: []
    post:
      summary: Set an RFID user name
      tags:
        - RFID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - rfid
              properties:
                rfid:
                  type: string
                name:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: setRfidUser
      description: >-
        Assign a user name to an RFID tag UID. Sending an empty name removes
        the mapping.
    delete:
      summary: Remove an RFID user name
      tags:
        - RFID
      parameters:
        - schema:
            type: string
          name: rfid
          in: query
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: removeRfidUser
      description: Remove the user name mapping for an RFID tag UID.
    parameters: []
  /login:
    post:
      operationId: login
      summary: Log in and obtain a session cookie
      description: |
        Checks the admin credentials and, on success, sets the `oevse_session`
        cookie (`HttpOnly`, `SameSite=Strict`). Only needed for browser-style
        clients; machine clients can use HTTP Basic on every request instead.

        This operation is reachable without authentication. Wrong credentials count
        towards the same brute-force throttle as a wrong Basic password.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user
                - pass
              properties:
                user:
                  type: string
                pass:
                  type: string
                remember:
                  type: boolean
                  description: Issue a 30 day cookie instead of a 6 hour one
                now:
                  type: integer
                  description: >-
                    Client time in epoch seconds. Only used to bootstrap the
                    device clock when it has none, so the cookie can be dated.
      responses:
        '200':
          description: Logged in; `Set-Cookie` carries the session
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                Invalid:
                  value:
                    msg: invalid
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: >-
            A session cannot be issued yet (`clock`: the device has no valid
            time and the client did not supply one; `not ready`: no signing
            secret). Use HTTP Basic instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /logout:
    post:
      operationId: logout
      summary: Clear the session cookie
      description: Always succeeds and does not require authentication.
      tags:
        - Authentication
      security: []
      responses:
        '200':
          description: Cookie cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /restart:
    post:
      summary: restart gateway or evse modules
      description: restart wifi gateway or openevse module
      operationId: restart
      tags:
        - Restart
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device:
                  type: string
                  description: gateway|evse
      responses:
        '200':
          description: Restart successfull
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: restart gateway|evse
  /limit:
    get:
      summary: Get charge limit
      description: 'This will return the limit type, value and auto_release (true|false) defined if there''s one'
      responses:
        '200':
          description: Limit properties
          content:
            application/json:
              schema:
                $ref: ./models/Limit.yaml
        '404':
          description: No limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: No limit
      operationId: limit_get
      tags:
        - Limit
    post:
      summary: Set charge limit
      description: 'This will set the limit type, value and auto_release (true|false)'
      responses:
        '200':
          description: Limit set
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: created
        '500':
          description: Failed to parse data
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: Failed to parse JSON
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./models/Limit.yaml
      operationId: limit_set
      tags:
        - Limit
    delete:
      summary: Get charge limit
      description: This will clear current limit
      responses:
        '200':
          description: Clear Limit ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: Deleted
        '404':
          description: No limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: No limit to clear
        '500':
          description: Failed to clear limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: Failed to clear limit
      operationId: limit_clear
      tags:
        - Limit
  /loadsharing/peers:
    get:
      summary: List discovered and configured peers
      description: |
        Return the set of peers that are discovered (mDNS) and/or configured as
        members of the load sharing group.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoadSharingPeer'
      operationId: listLoadSharingPeers
      tags:
        - Load Sharing
    post:
      summary: Add a peer to the load sharing group
      description: |
        Add a new peer to the load sharing group. The peer must be specified as a
        hostname or IP address (the value must contain `.` or `:`). On success the
        controller performs reciprocal peer-list sync on the remote unless
        `reciprocal` is false. Config push to the new member is handled separately
        by the peer poller after the WebSocket connection is established.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - host
              properties:
                host:
                  type: string
                  description: Hostname or IP address of the peer to add
                  example: openevse-2.local
                reciprocal:
                  type: boolean
                  default: true
                  description: |
                    When true (default), add this device to the remote peer's group
                    list. Set false when handling a reciprocal sync from the remote.
      responses:
        '200':
          description: Peer added or already in group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                Added:
                  value:
                    msg: done
                Already in group:
                  value:
                    msg: already in group
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                Invalid JSON:
                  value:
                    msg: Invalid JSON
                Missing host:
                  value:
                    msg: Missing required 'host' parameter
                Empty host:
                  value:
                    msg: Host cannot be empty
                Local device:
                  value:
                    msg: Cannot add local device as peer
                Invalid host format:
                  value:
                    msg: Invalid host format - must contain domain or IP
      operationId: addLoadSharingPeer
      tags:
        - Load Sharing
  '/loadsharing/peers/{host}':
    put:
      summary: Change the priority of a peer
      description: >-
        Only allowed on the group leader; members answer `403`.
      parameters:
        - in: path
          name: host
          required: true
          schema:
            type: string
          description: Hostname or IP address of the peer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - priority
              properties:
                priority:
                  type: integer
      responses:
        '200':
          $ref: '#/components/responses/UpdateSuccessful'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Load sharing configuration is read-only on members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Peer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
      operationId: updateLoadSharingPeer
      tags:
        - Load Sharing
    delete:
      summary: Remove a peer from the load sharing group
      description: |
        Remove a peer from the load sharing group. On success the controller
        performs reciprocal removal on the remote unless `reciprocal=false`.
        The controller also pushes a reset config to the removed member when
        applicable.
      parameters:
        - in: path
          name: host
          required: true
          schema:
            type: string
          description: Hostname or IP address of the peer to remove
        - in: query
          name: reciprocal
          required: false
          schema:
            type: boolean
            default: true
          description: |
            When true (default), remove this device from the remote peer's group
            list. Set false when handling a reciprocal sync from the remote.
      responses:
        '200':
          $ref: '#/components/responses/UpdateSuccessful'
        '400':
          description: Cannot remove local device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                Local device:
                  value:
                    msg: Cannot remove local device from group
        '404':
          description: Peer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                Peer not found:
                  value:
                    msg: Peer not found
      operationId: removeLoadSharingPeer
      tags:
        - Load Sharing
  /loadsharing/status:
    get:
      summary: Get load sharing runtime status
      description: |
        Return runtime status for load sharing, including online/offline peers and
        the most recent computed allocations.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadSharingStatus'
      operationId: getLoadSharingStatus
      tags:
        - Load Sharing
  /loadsharing/discover:
    post:
      summary: Trigger peer discovery
      description: |
        Trigger an mDNS discovery scan for other OpenEVSE devices.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
      operationId: discoverLoadSharingPeers
      tags:
        - Load Sharing
  /boost:
    get:
      summary: Get the active boost
      description: >
        Returns the active boost (type, value, remaining, started), or an
        empty object when no boost is active. The idle 200+{} response
        doubles as the capability probe: older firmware has no clean 404 for
        this path, so clients should treat any non-200-JSON response as
        unsupported rather than relying on a 404.
      responses:
        '200':
          description: Active boost, or {} when idle
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum: [time, energy, soc, range]
                  value:
                    type: integer
                    description: >
                      time: seconds (NOT minutes, unlike /limit); energy: Wh
                      added since activation; soc: absolute percent; range:
                      absolute distance
                  remaining:
                    type: integer
                    description: Remaining amount in the dimension's unit (ceil)
                  started:
                    type: string
                    format: date-time
      operationId: boost_get
      tags:
        - Boost
    post:
      summary: Arm (or replace) a boost
      description: >
        Boost charges NOW - an Active claim at priority 200 (above Divert and
        the Scheduler, below Manual and Limit) - until the target is reached,
        then releases so the previous controller resumes. Re-POSTing while a
        boost is active replaces it with a fresh activation snapshot. Time
        values clamp to 604800 seconds (7 days). Energy value is a Wh delta
        from the moment of activation; soc/range values are absolute targets
        and require a vehicle data source (422 otherwise). A soc/range target
        that is ALREADY met arms as a no-op: 201, no claim is taken, and GET
        /boost still returns {}. The MQTT <base>/boost event topic publishes
        the boolean boost + boost_version on every change; boost_reason
        ("reached", "cancelled" or "replaced") appears only on end events
        (boost false) and never on an active one, so a replace emits the end
        event first and then the fresh arm event. The retained <base>/boost
        state topic carries this same serialized object ({} when idle) - the
        retained remaining is a snapshot at arm/end, not a live countdown.
      responses:
        '201':
          description: Boost armed
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: created
        '400':
          description: Malformed body, unknown type, or zero value
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: Failed to parse JSON
        '422':
          description: soc/range boost without a vehicle data source
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: No vehicle data available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value]
              properties:
                type:
                  type: string
                  enum: [time, energy, soc, range]
                value:
                  type: integer
                  minimum: 1
      operationId: boost_set
      tags:
        - Boost
    delete:
      summary: Cancel the active boost
      description: This will clear the active boost, if any
      responses:
        '200':
          description: Boost cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: Deleted
        '404':
          description: No boost active
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: No boost to clear
      operationId: boost_clear
      tags:
        - Boost
  /notifications:
    get:
      summary: Get the advisory list
      description: >
        Returns every currently active advisory, acknowledged entries
        included - a muted advisory is still listed, marked acked, so the GUI
        can render it as muted rather than have it vanish. Advisories are
        non-fault conditions the user should know about (a safety check
        switched off, a fault that has already cleared, thermal state, relay
        wear); anything stopping the EVSE charging right now is a fault, not
        an advisory, and is reported through the state fields instead.
        first_seen and last_seen are epoch seconds, or 0 when the gateway's
        clock had not synced at the moment the reading was taken.
      responses:
        '200':
          description: The advisory list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: >
                      Number of UNMUTED advisories - what a badge should show.
                      The notifications array may be longer.
                  max_severity:
                    type: string
                    enum: [info, warning, critical]
                    description: Highest severity among the unmuted advisories
                  notifications:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: >
                            Stable dotted id, e.g. safety.ground_check. The
                            only thing a UI keys on; titles and detail text are
                            looked up from it.
                        category:
                          type: string
                          enum: [safety, fault, wear, thermal]
                        severity:
                          type: string
                          enum: [info, warning, critical]
                        sticky:
                          type: boolean
                          description: >
                            true when acknowledging mutes the advisory rather
                            than dismissing it - it stays listed, and keeps its
                            settings-page marker, until the condition clears.
                        acked:
                          type: boolean
                        first_seen:
                          type: integer
                          description: Epoch seconds, 0 if unknown (clock not synced)
                        last_seen:
                          type: integer
                          description: Epoch seconds, 0 if unknown (clock not synced)
      operationId: notifications_get
      tags:
        - Notifications
  /notifications/ack:
    post:
      summary: Acknowledge one advisory
      description: >
        Acknowledges the advisory named by id. A non-sticky advisory is
        dismissed until its token changes - the token is the underlying
        counter, so a later GFI trip raises it again. A sticky advisory is
        muted instead: it stays in the list marked acked and keeps its
        settings-page marker, but stops driving the LCD's amber border and
        advisory line. The acknowledgement survives a reboot; it is voided by
        any movement in the token, by any EVSE settings change for safety.*
        advisories, and by a firmware update.

        The id may be sent either on the query string
        (POST /notifications/ack?id=safety.ground_check, no body) or as an
        application/x-www-form-urlencoded body.
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: >
                    The advisory id. May instead be given as the `id` query
                    parameter.
      parameters:
        - name: id
          in: query
          required: false
          description: >
            The advisory id, e.g. safety.ground_check. Required unless the
            same name is sent in a form-encoded body.
          schema:
            type: string
      responses:
        '200':
          description: Acknowledged
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: No id given, in either the query string or the body
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: >
            GET used without the X-Requested-With: OpenEVSE header, or a
            cookie-authenticated request without it (CSRF guard)
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: No advisory with that id is currently active
          content:
            text/plain:
              schema:
                type: string
      operationId: notifications_ack
      tags:
        - Notifications
  /emeter:
    delete:
      summary: Reset Energy Meter
      description: This will clear the Energy Meter
      requestBody:
        content:
          application/json:
            schema:
              type: object
