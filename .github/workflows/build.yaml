# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build/Release OpenEVSE

permissions:
  contents: write
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

# Serialize runs per PR so a quick succession of pushes can't race to update
# the shared flash-size PR comment (a slow, older run finishing last used to
# clobber a newer run's report). A new push cancels the in-flight run for the
# same PR. Only pull_request runs are grouped: master pushes and tag builds get
# a unique group per run (not per ref -- a shared group would make GitHub drop
# the older *pending* run even without cancel-in-progress, skipping a commit's
# build), so they are never cancelled or replaced and a release run is never
# interrupted by a later commit. build_gui.yml is a separate workflow and is
# unaffected; its bot commit simply starts a fresh run here that supersedes the
# stale one.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Dump the environment
        run: echo "Environment variables:" && env | sort

      - name: Dump the event
        run: cat $GITHUB_EVENT_PATH

      - name: Dump github.ref_name
        run: echo "github.ref_name = '${{ github.ref_name }}'"

  test:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Install Avahi development libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libavahi-client-dev libavahi-common-dev libssl-dev

    - name: Run native unit tests
      run: |
        mkdir -p doctest_results
        # PlatformIO builds all test suites to the same .pio/build/native_test/program
        # path (no per-suite subdirectory), so run each suite individually to capture
        # JUnit output before the binary is overwritten by the next suite.
        for suite_dir in test/test_*/; do
          name=$(basename "$suite_dir")
          pio test -e native_test -f "$name" --without-testing
          .pio/build/native_test/program --reporters=junit --out="doctest_results/${name}.xml"
        done

    - name: Upload test results
      uses: actions/upload-artifact@v7
      with:
        name: pio_test_results
        path: doctest_results/

    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: doctest_results/*.xml
        check_name: Unit Tests

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # OIDC exchange for the ELF archive step below

    env:
      # Dormant until the crash service is deployed and its secrets are set.
      # Without this the first master push after merge fails the OIDC exchange
      # on an empty role-to-assume, failing all 19 device builds and the
      # release job that needs them. Same shape as SIGN_ENABLED below.
      CRASH_ARCHIVE_ENABLED: ${{ secrets.CRASH_ELF_ROLE_ARN != '' && secrets.CRASH_BUCKET != '' && (vars.CRASH_AWS_REGION != '' || secrets.CRASH_AWS_REGION != '') }}

      # Environments whose Arduino core (core-3.x / pioarduino / IDF5) provides
      # the signed-update verifier. Signed OTA is only enforced on these; add
      # future core-3.x envs here. Older-core (4MB) envs cannot verify and are
      # left unsigned.
      SIGNED_OTA_ENVS: '["openevse_wifi_v1_16mb"]'
      # 'true' only when the image-signing key is configured. Keeps signed OTA
      # dormant (builds unchanged, unsigned) until the OTA_SIGNING_KEY secret is
      # added, so merging this does not alter the fleet's update behaviour.
      SIGN_ENABLED: ${{ secrets.OTA_SIGNING_KEY != '' }}

    strategy:
      fail-fast: false
      matrix:
        env:
          - nodemcu-32s
          - espressif_esp-wrover-kit
          - espressif_esp-wrover-kit_latest
          - adafruit_huzzah32_dev
          - adafruit_huzzah32
          - adafruit_featheresp32
          - openevse_wifi_v1
          - openevse_wifi_v1_rc522
          - olimex_esp32-gateway-old
          - olimex_esp32-gateway-e
          - olimex_esp32-gateway-f
          - olimex_esp32-gateway-e_dev
          - olimex_esp32-gateway-f_dev
          - olimex_esp32-poe-iso
          - heltec_esp32-wifi-lora-v2
          - wt32-eth01
          - esp32-c3-devkitc-02
          - openevse_wifi_tft_v1
          - openevse_wifi_tft_v1_dev
          # core-3.x (pioarduino / IDF5) — 16MB+ boards
          - openevse_wifi_v1_16mb
          - native_openevse

    steps:
    - uses: ammaraskar/gcc-problem-matcher@master

    - uses: actions/checkout@v7

    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache PlatformIO
      uses: actions/cache@v6
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install PlatformIO
      # Pinned: PlatformIO Core 6.2.0 bumped its bundled build engine to
      # SCons 4.11.1 (tool-scons@4.41101.0), which fails every core-3.x
      # (pioarduino, arduino+espidf hybrid) env at the final link step with
      # `ModuleNotFoundError: No module named 'SCons.Tool.FortranCommon'`
      # (openevse_wifi_v1_16mb, openevse_wifi_tft_v1[_dev]). 6.1.19 is the
      # last release still on SCons 4.8.1 (tool-scons@4.40801.0), which
      # works. Bump this once upstream ships a SCons/PlatformIO release that
      # fixes it.
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade "platformio==6.1.19"

    - name: Install Avahi development libraries
      if: matrix.env == 'native_openevse'
      run: |
        sudo apt-get update
        sudo apt-get install -y libavahi-client-dev libavahi-common-dev libssl-dev

    - name: Run PlatformIO
      id: pio_build
      env:
        # Enforce signed OTA only when a signing key is configured AND this is a
        # signed-capable env. Dormant (unsigned, unchanged) until the
        # OTA_SIGNING_KEY secret is added, so merging this does not alter the
        # fleet's update behaviour on its own.
        PLATFORMIO_BUILD_FLAGS: ${{ (env.SIGN_ENABLED == 'true' && contains(fromJSON(env.SIGNED_OTA_ENVS), matrix.env)) && '-DUPDATE_SIGN -DREQUIRE_SIGNED_OTA' || '' }}
      # Capture pio's own output (it prints the "Flash: NN.N% (used X bytes
      # from Y bytes)" line the flash usage check reads) while still failing
      # this step on pio's exit code, not tee's.
      run: |
        set -o pipefail
        pio run -e ${{ matrix.env }} 2>&1 | tee pio-build-${{ matrix.env }}.log

    - name: Check flash usage
      # Runs whether or not the build above succeeded: PlatformIO's own size
      # check runs (and can fail the build) right after linking, before most
      # compile/link failures would even occur, so an over-budget build's log
      # still has a "Flash:" line worth reporting. check_flash_size.py skips
      # (exit 0) when there's no such line AND the env is exempt (native, or
      # the build didn't succeed) -- otherwise a missing line means something
      # unexpected happened and it fails loudly instead of silently vanishing
      # from the report.
      if: always()
      run: |
        python scripts/check_flash_size.py \
          --env ${{ matrix.env }} \
          --log pio-build-${{ matrix.env }}.log \
          --build-outcome ${{ steps.pio_build.outcome }} \
          ${{ matrix.env == 'native_openevse' && '--native' || '' }} \
          --out flash-size-${{ matrix.env }}.json

    - name: Upload flash size report
      # Same condition as the check above -- runs whenever it could have
      # produced a report, including when it (or the build) failed.
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: flash-size-${{ matrix.env }}
        path: flash-size-${{ matrix.env }}.json
        # native_openevse (and any build that failed before linking) has no
        # JSON to upload -- that's expected, not something to flag.
        if-no-files-found: ignore

    - name: Sign firmware image
      # Append the RSA-2048 PSS signature trailer expected by REQUIRE_SIGNED_OTA
      # builds. Same gating as the build flags above.
      if: ${{ env.SIGN_ENABLED == 'true' && contains(fromJSON(env.SIGNED_OTA_ENVS), matrix.env) }}
      env:
        OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
      run: |
        pip install cryptography
        python scripts/sign_firmware.py --key-env OTA_SIGNING_KEY \
          ".pio/build/${{ matrix.env }}/firmware.bin" ".pio/build/${{ matrix.env }}/firmware.bin"

    - name: Upload output to GitHub
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.env }}.bin
        path: .pio/build/${{ matrix.env }}/*.bin

    - name: Configure AWS credentials for the ELF archive
      # Pushes, and PRs from branches in this repo: PR artifacts are what
      # testers flash, and a dump from an unarchived build can never be
      # symbolized. A fork PR runs in the base repo with empty secrets, so it
      # is excluded by its head repo rather than left to fail on them.
      if: ${{ env.CRASH_ARCHIVE_ENABLED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && matrix.env != 'native_openevse' }}
      continue-on-error: true
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ secrets.CRASH_ELF_ROLE_ARN }}
        # A variable or a secret: the region is not sensitive, but a
        # collaborator may only be able to create secrets.
        aws-region: ${{ vars.CRASH_AWS_REGION || secrets.CRASH_AWS_REGION }}

    - name: Archive firmware.elf under its own SHA-256
      # Best-effort: a missing ELF archive costs a future backtrace, a failed
      # release costs the release.
      continue-on-error: true
      # A crash backtrace is a list of addresses; the ELF is what names them.
      # Keyed by the ELF's own hash, which the device reports as `elf_sha256`
      # in /debug/crash and which is byte-identical to sha256sum of the ELF.
      # No version string, so no escaping and no ambiguity between two builds
      # that share a branch and commit but differ.
      if: ${{ env.CRASH_ARCHIVE_ENABLED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && matrix.env != 'native_openevse' }}
      # As data, not script text: a branch named $(...) would otherwise run.
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        ELF=".pio/build/${{ matrix.env }}/firmware.elf"
        SHA=$(sha256sum "$ELF" | cut -d' ' -f1)
        echo "elf/$SHA.elf  <- ${{ matrix.env }}"
        aws s3 cp "$ELF" "s3://${{ secrets.CRASH_BUCKET }}/elf/$SHA.elf" \
          --metadata "buildenv=${{ matrix.env }},ref=$REF_NAME,sha=${{ github.sha }}"

    - name: Upload native output to GitHub
      if: matrix.env == 'native_openevse'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.env }}.program
        path: .pio/build/${{ matrix.env }}/program

  flash-size-report:
    name: Flash size report
    runs-on: ubuntu-latest
    needs: build
    # Runs even if a build failed (e.g. over the flash budget) so the PR
    # comment still shows the offending env's usage. !cancelled() rather than
    # always(): a run superseded by a newer push (see concurrency above) must
    # not go on to post a stale report.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}

    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v7

    - name: Download flash size data for this PR
      uses: actions/download-artifact@v8
      with:
        pattern: flash-size-*
        path: current-flash-size
        merge-multiple: true

    - name: Download baseline flash size data from the base branch
      # Best-effort: the base branch may not have a build with flash size
      # artifacts yet (e.g. right after this feature is added), so a miss
      # here just means the report shows sizes with no "change vs base".
      uses: dawidd6/action-download-artifact@v27
      continue-on-error: true
      with:
        workflow: build.yaml
        workflow_conclusion: completed
        branch: ${{ github.event.pull_request.base.ref }}
        event: push
        name: flash-size-.*
        name_is_regexp: true
        path: baseline-flash-size
        search_artifacts: true
        if_no_artifact_found: warn

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Build flash size report
      run: |
        python scripts/report_flash_size.py \
          --current-dir current-flash-size \
          --baseline-dir baseline-flash-size \
          --out flash-size-report.md
        cat flash-size-report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Check this run is for the PR's current head
      # Backstop for the concurrency group above: if a newer commit has landed
      # since this run started (cancellation not yet delivered, or this job
      # finished in the gap), don't let it overwrite a fresher report.
      id: head_check
      if: github.event.pull_request.head.repo.full_name == github.repository
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RUN_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        current=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq .head.sha)
        if [ "$current" = "$RUN_SHA" ]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping PR comment: run is for ${RUN_SHA}, PR head is now ${current}."
        fi

    - name: Comment on PR
      # Skipped for fork PRs: the pull_request event gives their GITHUB_TOKEN
      # only read access, so posting a comment would just fail. Same pattern
      # as native_docker.yaml's fork-excluded publish step. The report is
      # still in the job summary above for a fork PR's author to read.
      # Also skipped when a newer commit has superseded this run (see above).
      if: github.event.pull_request.head.repo.full_name == github.repository && steps.head_check.outputs.current == 'true'
      uses: marocchino/sticky-pull-request-comment@v3
      with:
        header: flash-size-report
        path: flash-size-report.md

  release:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'master' || startsWith(github.ref_name, 'v')

    steps:
    - name: Checkout (with the migrator submodule)
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Download the built assets
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Rename images to something more sensible
      run: |
        find artifacts -name 'firmware.bin' | while read -r image; do
          dir=$(dirname "${image}")
          board=$(basename "${dir}")
          echo mv "$image" "$board"
          mv "$image" "$board"
        done

    - name: Get the bootloader and partition files
      run: |
        for i in openevse_wifi_tft_v1:16mb openevse_wifi_v1:4mb openevse_wifi_v1_16mb:v1_16mb; do
          env=$(cut -f1 -d: <<< $i)
          name=$(cut -f2 -d: <<< $i)
          mv artifacts/$env.bin/bootloader.bin bootloader_$name.bin
          mv artifacts/$env.bin/partitions.bin partitions_$name.bin
        done

    - name: Drop the _dev images from the release
      # The _dev environments are for bench work, not for users: olimex_*_dev
      # use min_spiffs_debug.csv, a single-slot layout that can never OTA
      # again once flashed; openevse_wifi_tft_v1_dev drops ENABLE_TSDB and the
      # larger SCHEDULER_MAX_EVENTS; and every _dev env carries
      # ENABLE_FULL_RAPI, which passes any RAPI command through /r. They stay
      # in the build matrix (and as workflow artifacts) so they keep compiling.
      run: rm -f ./*_dev.bin

    - name: Build the 16MB migrator
      # The protected bootloader/partition-table commit OpenEVSE-4MB cannot do
      # from Arduino is delegated to a tiny ESP-IDF migrator app built with
      # DANGEROUS_WRITE_ALLOWED. It embeds the 16MB bootloader + partition table
      # (regenerated here from this build) and is OTA'd into a slot at migration
      # time. See docs/flash_migrate_repartition.md.
      run: |
        mkdir -p migrator/_embed
        cp bootloader_v1_16mb.bin migrator/_embed/bootloader.bin
        cp partitions_v1_16mb.bin migrator/_embed/partitions.bin
        python migrator/scripts/gen_embeds.py migrator/_embed
        ( cd migrator && pio run -e esp32dev )
        cp migrator/.pio/build/esp32dev/firmware.bin openevse_migrator.bin

    - name: Generate 16MB migration manifest
      # { app, migrator }: the normal 16MB OpenEVSE app (staged to ota_1) plus the
      # migrator that performs the protected commit. The migrator carries the
      # bl/PT, so they are not downloaded separately. URLs point at this release;
      # keep the firmware's MIGRATE_MANIFEST_URL pointed at the same repo/release.
      run: |
        if [ "${{ github.ref_name }}" = "master" ]; then TAG=latest; else TAG="${{ github.ref_name }}"; fi
        BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}"
        app_sha=$(sha256sum openevse_wifi_v1_16mb.bin | cut -d' ' -f1)
        mig_sha=$(sha256sum openevse_migrator.bin | cut -d' ' -f1)
        cat > migrate_v1_16mb.json <<EOF
        {
          "target": "openevse_wifi_v1_16mb",
          "target_partitions": "openevse_16mb",
          "flash_size": "16MB",
          "app":      { "url": "${BASE}/openevse_wifi_v1_16mb.bin", "sha256": "${app_sha}" },
          "migrator": { "url": "${BASE}/openevse_migrator.bin",     "sha256": "${mig_sha}" }
        }
        EOF
        cat migrate_v1_16mb.json

    - name: Upload assets to latest release
      if: github.ref_name == 'master'
      uses: "softprops/action-gh-release@v3"
      with:
        prerelease: true
        tag_name: latest
        name: Development Build
        generate_release_notes: true
        files: |
          *.bin
          migrate_v1_16mb.json

    - name: Upload assets to release
      if: startsWith(github.ref_name, 'v')
      uses: "softprops/action-gh-release@v3"
      with:
        prerelease: true
        name: "${{ github.ref_name }}"
        files: |
          *.bin
          migrate_v1_16mb.json
