name: Validate API docs

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Run Spectral
    runs-on: ubuntu-latest
    steps:
      # Check out the repository
      - uses: actions/checkout@v7

      # Every route registered in src/web_server*.cpp must have an api.yml path
      - name: Check routes are documented
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check_api_routes.py

      # Run Spectral
      - uses: stoplightio/spectral-action@latest
        with:
          file_glob: 'api.yml'
