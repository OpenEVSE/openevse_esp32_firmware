; PlatformIO project configuration, split across three files (merged via
; extra_configs below):
;   platformio.ini            - shared [common]/[env] config + officially
;                                supported OpenEVSE boards (env:openevse_wifi_*)
;   platformio_native.ini     - host-side native/simulator/test envs
;   platformio_community.ini  - community-contributed board envs
;
; Build features (set as -D flags, see [common] below):
; - ENABLE_DEBUG           - Turn on general debug options
; - ENABLE_DEBUG_WEB       - Enable debug of the web server (noisy)
; - ENABLE_DEBUG_RAPI      - Enable debug of the RAPI code (noisy)
; - ENABLE_PROFILE         - Turn on the profiling
; - ENABLE_OTA             - Enable Arduino OTA update
; - ENABLE_ASYNC_WIFI_SCAN - Enable async WiFi scanning, requires Git version of ESP core
;
; Config
; - WIFI_LED   - Pin to use for (and enable) WiFi status LED notifications
; - DEBUG_PORT - Serial port for debug messages (Serial is used for RAPI,
;                so pick a different port if the board has one connected
;                to an OpenEVSE controller)

[platformio]
data_dir = src/data
default_envs = openevse_wifi_v1
extra_configs =
  platformio_native.ini
  platformio_community.ini

[common]
# Two Arduino cores, split by flash size:
#   * 4MB boards stay on core 2.x: [env] platform = espressif32@7.1.3. Their
#     image must fit dual-slot OTA on 4MB flash, which the core 3 build did not.
#   * 16MB+ boards (the hybrid arduino+espidf envs) use core 3.x through
#     platform = ${common.platform_core3}: the official espressif32 8.0.0
#     (Arduino-ESP32 3.x on ESP-IDF 5.5.x).
# scripts/pio routes envs that use ${common.platform_core3} to their own
# PLATFORMIO_CORE_DIR, so the two cores do not evict each other's packages.
platform_core3 = espressif32@8.0.0
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  jeremypoulter/ArduinoMongoose@1.2.0
  jeremypoulter/Micro Debug@0.0.5
  jeremypoulter/ConfigJson@0.0.8
  openevse/OpenEVSE@0.0.24  ; PlatformIO registry package (was a git+tag pin) - D9 command support (protocol-gated) + relay-health $GL/$FH/$FK, 2-line LCD backlight type setter
  jeremypoulter/ESPAL@0.0.7
  jeremypoulter/StreamSpy@0.0.2
  jeremypoulter/MicroTasks@0.0.4
  https://github.com/jeremypoulter/MicroOcpp.git#dc2365d9f16f878eaedfb2fcbe0c34d03a1d9d78  ; maintenance/v1.2.x: MicroOcpp 1.2.0 + ArduinoJson v7 support (still v6 compatible); unpin once released upstream
  matth-x/MicroOcppMongoose@1.2.0
lib_ignore = WebSockets ; MicroOcpp: don't compile built-in WS library
extra_scripts =
  pre:scripts/auto_fw_version.py
  scripts/extra_script.py
debug_flags =
  -ggdb
  -D ENABLE_FULL_RAPI
  -D ENABLE_DEBUG
  -D ENABLE_OTA
  #-D ENABLE_DEBUG_WEB
  #-D ENABLE_DEBUG_WEB_REQUEST
  #-D ENABLE_DEBUG_SCHEDULER
  #-D ENABLE_DEBUG_TIME
  #-D ENABLE_DEBUG_EVSE_MAN
  #-D ENABLE_DEBUG_EVSE_MONITOR
  #-D ENABLE_DEBUG_DIVERT
  #-D ENABLE_DEBUG_LED
  #-D ENABLE_DEBUG_LCD
  #-D ENABLE_DEBUG_MQTT
  #-D ENABLE_DEBUG_EMONCMS
  #-D ENABLE_DEBUG_TESLA_CLIENT
  #-D ENABLE_DEBUG_LIMIT
  #-D ENABLE_PROFILE
  #-D ENABLE_DEBUG_HTTP_UPATE
  #-D ENABLE_NOISY_PROFILE
  #-D ENABLE_DEBUG_MICROTASKS
  #-D ENABLE_DEBUG_ENERGY_METER
  #-D ENABLE_DEBUG_MEMORY_MONITOR
  #-D ENABLE_DEBUG_CETRIFICATES
  #-D ENABLE_DEBUG_WEB_CETRIFICATES
  #-D ENABLE_DEBUG_MONGOOSE_MQTT_CLIENT
  #-D ENABLE_DEBUG_SCREEN_MANAGER
  #-D ENABLE_DEBUG_SCREEN_RENDERER
  #-D ENABLE_DEBUG_SCREEN_CHARGE
  #-D ENABLE_DEBUG_SCREEN_BOOT
  #-D ENABLE_DEBUG_LOADSHARING_DISCOVERY
  #-D ENABLE_DEBUG_LOADSHARING_POLLER
feature_flags =
  ; Mongoose 7 selects its TLS backend with MG_TLS and defaults to MG_TLS_NONE.
  ; Nothing was setting it, so TLS was compiled out entirely -- mg_mgr_init()
  ; reported "TLS: none" and every HTTPS connection died with "TLS is not
  ; enabled". MG_TLS_BUILTIN is Mongoose's own TLS 1.3 stack; it costs ~46 KB of
  ; flash against ~71 KB for MG_TLS_MBED, which does not fit on the 4 MB boards.
  -D MG_TLS=MG_TLS_BUILTIN
  -D MG_MAX_HTTP_REQUEST_SIZE=8196
  ; Reverse proxies/tunnels add many headers; Mongoose silently drops any beyond
  ; this (default 30), and Cookie sits late in the list -> session lost -> login loop.
  ; 48 covers browser + proxy headers with headroom; each slot costs 16 B on the
  ; ESP32, paid on the 8 KB loop stack (parsed message is a local in http_cb).
  -D MG_MAX_HTTP_HEADERS=48
  ; ArduinoJson v7 config, tuned for what this app actually needs (see
  ; OpenEVSE/openevse_esp32_firmware#1224 for the flash-budget context):
  ; - No code path parses JSON from a PROGMEM/F() literal -- everything
  ;   comes from the network or LittleFS -- so the PROGMEM helpers are
  ;   dead weight.
  ; - float instead of double for internal number storage. Measured
  ;   round-trip error against this app's real value ranges (currents,
  ;   voltages, ratios, energy-meter kWh totals): a lifetime total of
  ;   99,999.999 kWh -- already an unrealistic figure for a home
  ;   charger -- drifts by 0.001 kWh, below the 2-decimal display
  ;   resolution used everywhere it's shown. Calibration constants
  ;   (e.g. current-sensor scale/offset) round-trip exactly.
  -D ARDUINOJSON_ENABLE_PROGMEM=0
  -D ARDUINOJSON_USE_DOUBLE=0
  ; MicroOcpp 1.2.0 still calls the ArduinoJson v6 API, which v7 marks
  ; deprecated; silence the warning noise (~355 hits) so it stops burying CI's gcc problem-matcher.
  -D ARDUINOJSON_DEPRECATED\\(msg\\)=
  #-D ARDUINO_MONGOOSE_DEFAULT_STREAM_BUFFER=2048
  #-D ARDUINO_MONGOOSE_SEND_BUFFER_SIZE=2048
  #-D ENABLE_DEBUG
  #-D ENABLE_DEBUG_MICROTASKS
  -D MO_CUSTOM_WS ; MicroOcpp: don't use built-in WS library
  -D MO_CUSTOM_CONSOLE ; MicroOcpp: use custom debug out
  ; Keep OCPP logging at WARN for 4MB flash headroom.
  -D MO_DBG_LEVEL=MO_DL_WARN
  -D MO_MG_USE_VERSION=MO_MG_V715 ; MicroOcppMongoose compatibility path for Mongoose v7
  #-D ENABLE_DEBUG
  #-D ENABLE_DEBUG_MONGOOSE_HTTP_CLIENT
  -D RAPI_MAX_COMMANDS=20
  -D BUILD_ENV_NAME="$PIOENV"

build_flags =
  -fno-exceptions ; paired with [env]'s `build_unflags = -fexceptions` above
  ; NB: no `-D ESP32` here -- the Arduino framework already defines it, and on
  ; the two platforms it does so with different values: core-2.x defines it
  ; bare (= 1) while core-3.x has arduino-esp32 export
  ; `-DESP32=ESP32` from its CMakeLists as a PUBLIC compile option. Adding our
  ; own bare `-D ESP32` on top of that made gcc warn `"ESP32" redefined` for
  ; every core-3 translation unit. Nothing here tests ESP32 arithmetically
  ; (only #ifdef / defined()), so the framework's definition is all we need.
  -D ARDUINO_ARCH_ESP32
  -D USE_ESP32
  -D USE_ESP32_FRAMEWORK_ARDUINO
  ${common.feature_flags}

build_flags_openevse_tft =
  ${common.build_flags}
  ${common.gfx_display_hw_flags}
  ; Cable NTC thermistor monitoring ($GN/$SN/$FF C, controller firmware
  ; 9.4.0+). Opt-in per env, NOT in common.build_flags: it costs ~7.5KB of
  ; flash and every 4MB env (min_spiffs.csv) is already at ~99.7% of its app
  ; partition, so enabling it there overflows the build. Only the two 16MB
  ; envs have the room. Revisit if the 4MB image ever gets a diet.
  -D ENABLE_CABLE_TEMP
  -D TFT_BACKLIGHT_CHARGING_THRESHOLD=0.1
  -D NEO_PIXEL_PIN=26
  -D NEO_PIXEL_LENGTH=4
  -D WIFI_PIXEL_NUMBER=1
  -D WIFI_BUTTON=0
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  -D I2C_SDA=22
  -D I2C_SCL=21
  -D ENABLE_WS2812FX
  -D ENABLE_MCP9808
  -D ENABLE_PN532
  ; UART2 pins, pinned explicitly. Both TFT envs put something on Serial2 --
  ; the release env its debug console, the _dev env the RAPI link to the
  ; OpenEVSE -- and neither can rely on the core's default any more:
  ; arduino-esp32 2.0.17 defaulted ESP32 UART2 to RX2=16/TX2=17, but 3.x
  ; (HardwareSerial.h, "Default pins for UART2 are arbitrary") changed it to
  ; RX2=4/TX2=25. Nothing is wired to 4/25 on this board, so begin() succeeds
  ; on dead pins and the only symptom is silence -- for _dev that reads as
  ; "OpenEVSE not responding or not connected". The ch_denky variant defines
  ; no RX2/TX2 of its own, so this is the only thing holding the pins.
  -D RX2=16
  -D TX2=17
build_partitions = min_spiffs.csv
build_partitions_debug = min_spiffs_debug.csv
build_partitions_16mb = openevse_16mb.csv

neopixel_lib = adafruit/Adafruit NeoPixel@1.15.5
ws2812fx_lib = kitesurfer1404/WS2812FX@1.4.7
; LVGL is pinned by release archive rather than a registry spec on purpose: v8.4.0
; is the last v8 release and the v9 uplift is its own piece of work (#1275). The
; PlatformIO dependabot only follows registry specs, so this stops it re-proposing
; every 9.x release; bump the tag here when the uplift lands.
lvgl_lib = https://github.com/lvgl/lvgl/archive/refs/tags/v8.4.0.zip

gfx_display_libs =
#  ${common.lvgl_lib}
  bodmer/TFT_eSPI@^2.5.43
  SPI

# TFT panel hardware (ILI9488 driver, pins, SPI) WITHOUT enabling any on-device
# renderer. Shared by the legacy TFT_eSPI renderer and the LVGL renderer.
gfx_display_hw_flags =
  -D USER_SETUP_LOADED
  -D ILI9488_DRIVER
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_BL=27
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TOUCH_CS=33
#  -D LOAD_GLCD
#  -D LOAD_FONT2
#  -D LOAD_FONT4
#  -D LOAD_FONT6
#  -D LOAD_FONT7
#  -D LOAD_FONT8
  -D LOAD_GFXFF
#  -D SMOOTH_FONT
#  -D SPI_FREQUENCY=15999999
#  -D SPI_FREQUENCY=20000000
#  -D SPI_FREQUENCY=27000000
  -D SPI_FREQUENCY=40000000
#  -D SPI_FREQUENCY=55000000
#  -D SPI_FREQUENCY=65000000
#  -D SPI_FREQUENCY=80000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=600000

# LVGL renderer (src/lcd_lvgl.cpp, src/lvgl_tft/). This is the renderer for the
# stock ILI9488 TFT — the openevse_wifi_tft_v1.* envs default it on via this
# fragment. TFT_eSPI is still the low-level ILI9488 SPI driver underneath.
lvgl_tft_renderer_flags =
  # lv_font_conv's generated fonts #include "lvgl/lvgl.h" unless this is set;
  # the library puts lvgl.h at its root, so they need the simple form.
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D ENABLE_SCREEN_LVGL_TFT
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_CONF_SUPPRESS_DEFINE_CHECK
  -D LCD_BACKLIGHT_TIMEOUT_DEFAULT=600  # idle-timeout default for the LVGL TFT (seconds)
  -I src/lvgl_tft

[env]
# specify exact Arduino ESP SDK version, requires platformio 3.5+ (curently dev version)
# http://docs.platformio.org/en/latest/projectconf/section_env_general.html#platform
#platform = https://github.com/platformio/platform-espressif32.git#feature/stage
#platform = https://github.com/platformio/platform-espressif32.git#develop
#platform = espressif32@1.11.1
platform = espressif32@7.1.3
#framework = arduino, espidf
framework = arduino
lib_deps = ${common.lib_deps}
lib_ignore = ${common.lib_ignore}
build_flags = ${common.build_flags}
; The Arduino-ESP32 framework builder unconditionally adds -fexceptions to
; CXXFLAGS. Nothing in this codebase or its libs (checked: ArduinoJson,
; ArduinoMongoose, MicroOcpp, ConfigJson, OpenEVSE, Adafruit GFX) throws or
; catches, so paying for unwind tables buys nothing -- and they're not free:
; on openevse_wifi_v1 they're ~106KB (5.4% of the 4MB partition) baked into
; .flash.rodata, one entry per function. Removing them recovers that flash
; directly and, on top, roughly triples the effective savings of any change
; that removes/simplifies code, since fewer functions means fewer unwind
; entries too. See OpenEVSE/openevse_esp32_firmware#1224 for the flash-budget
; context this was measured against.
build_unflags = -fexceptions
#upload_port = openevse.local
upload_speed = 921600
extra_scripts = ${common.extra_scripts}
board_build.partitions = ${common.build_partitions}
#platform_packages =
#  ; use a special branch
#  framework-arduinoespressif32 @ https://github.com/marcovannoord/arduino-esp32.git#idf-release/v4.0
#    platformio/framework-arduinoespressif32 @ ~3.10006.0
monitor_speed = 115200
monitor_filters =
  esp32_exception_decoder

[env:openevse_wifi_v1]
board = esp32dev
lib_deps =
  ${common.lib_deps}
  ${common.neopixel_lib}
  adafruit/Adafruit MCP9808 Library @ 2.0.2
build_flags =
  ${common.build_flags}
  ${common.debug_flags}
  -D NEO_PIXEL_PIN=17
  -D NEO_PIXEL_LENGTH=14
  -D WIFI_PIXEL_NUMBER=1
  -D WIFI_BUTTON=0
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  -D RAPI_PORT=Serial
  -D DEBUG_PORT=Serial1
  -D I2C_SDA=21
  -D I2C_SCL=22
  -D ENABLE_MCP9808
  -D ENABLE_PN532
  -D TX1=16
  -D ENABLE_FLASH_MIGRATE
  ; One-click crash reporting: ~4.9 KB of flash (92.5% -> 92.7%).
  -D ENABLE_CRASH_UPLOAD=1
upload_command = curl -H "Content-Type: application/octet-stream" --data-binary "@$SOURCE" http://$UPLOAD_PORT/update --progress-bar | cat

# RC522 (MFRC522) on SPI — same base features as openevse_wifi_v1 but PN532 disabled.
# Default wiring: SS=5, RST=4, SCK=18, MOSI=23, MISO=19 (override via -D RC522_*).
# GPIO22 is I2C_SCL on this board (MCP9808); do not use it for RC522_RST unless MCP9808
# is disabled in the build.
[env:openevse_wifi_v1_rc522]
board = esp32dev
lib_deps =
  ${common.lib_deps}
  ${common.neopixel_lib}
  adafruit/Adafruit MCP9808 Library @ 2.0.2
  miguelbalboa/MFRC522 @ 1.4.12
build_flags =
  ${common.build_flags}
  ${common.debug_flags}
  -D NEO_PIXEL_PIN=17
  -D NEO_PIXEL_LENGTH=14
  -D WIFI_PIXEL_NUMBER=1
  -D WIFI_BUTTON=0
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  -D RAPI_PORT=Serial
  -D DEBUG_PORT=Serial1
  -D I2C_SDA=21
  -D I2C_SCL=22
  -D ENABLE_MCP9808
  -D ENABLE_RC522
  -D RC522_SS_PIN=5
  -D RC522_RST_PIN=4
  -D RC522_SPI_SCK=18
  -D RC522_SPI_MISO=19
  -D RC522_SPI_MOSI=23
  -D TX1=16
  -D ENABLE_FLASH_MIGRATE
upload_command = curl -F firmware=@$SOURCE http://$UPLOAD_PORT/update --progress-bar | cat

[env:openevse_wifi_tft_v1]
board = denky32
platform = ${common.platform_core3}
# Arduino as an ESP-IDF component ("hybrid" build): the ESP-IDF (5.5.5, the
# version the 8.0.0 platform's prebuilt Arduino libs use) is compiled from
# source instead of being consumed as a prebuilt static-library bundle. The seed
# files in sdkconfig.defaults are from the 3.3.11 libs, so the resolved sdkconfig
# is not identical to the prebuilt one; see the note in that file.
#
# Why: sdkconfig options are REAL Kconfig here, resolved by kconfgen against
# the IDF's own Kconfig tree. Concretely that means an option which exists
# actually takes effect instead of being a decorative line, its dependencies
# are resolved for real, and anything it selects comes along automatically
# (enabling CONFIG_MBEDTLS_DYNAMIC_BUFFER pulled in
# CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT=y unasked). An unsatisfiable dependency
# on a real symbol is visible in the resolved sdkconfig.<env>, so you can see
# what you actually got. What this does NOT buy you: a symbol name that does
# not exist at all is still dropped in silence, exactly as on the prebuilt
# path — negative-tested 2026-08-25 with CONFIG_MBEDTLS_DYNAMIC_FREE_PEER_CERT,
# build SUCCESS with no warning. Always confirm an option landed by grepping
# the generated sdkconfig.<env>, never by the build exiting 0.
#
# The concrete payoff: enabling CONFIG_MBEDTLS_DYNAMIC_BUFFER now actually
# rebuilds mbedtls with its own linker wrap flags for the mbedtls_ssl_*
# symbols. Without this the option is inert (the prebuilt-library path drops
# such flags), and getting it would otherwise mean carrying 12
# hand-written linker wrap flags as build_flags.
# Design and Phase 0 spike plan:
# docs/superpowers/specs/2026-08-25-arduino-idf-component-design.md
#
# `custom_sdkconfig` is not read in this mode (espressif32's espidf builder
# ignores it). The mechanism is the committed seed
# files: sdkconfig.defaults (shared base) plus, for this env, the
# sdkconfig.defaults.tls overlay selected via SDKCONFIG_DEFAULTS below.
#
# HAZARD: sdkconfig.<env> is the authority once generated. After editing any
# seed file you MUST delete sdkconfig.openevse_wifi_tft_v1 (or run
# `pio run -t fullclean`) or the edit silently does nothing.
framework = arduino, espidf
# NOTE: no whitespace before the `;` separating the SDKCONFIG_DEFAULTS list
# entries. PlatformIO's configparser treats " ;" as an inline comment and would
# truncate the line without complaint, dropping the TLS overlay entirely
# (symptom: the __wrap_mbedtls_ssl_* symbols vanish from firmware.elf).
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.tls
build_flags =
  ${common.build_flags_openevse_tft}
  ${common.lvgl_tft_renderer_flags}
  -D ENABLE_TSDB
  -D DEBUG_PORT=Serial2
  -D RAPI_PORT=Serial
  ; This board has no PSRAM and runs with ~60KB free heap, so it takes a
  ; smaller schedule table than the 50-entry default. 16 is well clear of any
  ; usage seen in the field and returns ~4.3KB of .bss.
  -D SCHEDULER_MAX_EVENTS=16
  ; NB: raising ARDUINO_MONGOOSE_DEFAULT_STREAM_BUFFER was tried and reverted.
  ; At 4096 it did remove the realloc ladder, but every response -- including
  ; the 2-byte "{}" ones -- then reserved 4KB up front, and with a handful of
  ; concurrent connections that cost more than the fragmentation it cured
  ; (measured: /override went from 0 to 4,096 bytes of largest-block drop).
  ; The handlers that emit large bodies serialise into a right-sized buffer
  ; and write once instead; see handleStatus and handleConfigGet.
  ; This is a hybrid Arduino-as-ESP-IDF-component build (`framework = arduino,
  ; espidf` above): the espidf managed component tree it pulls in includes
  ; espressif__esp_modem, which genuinely uses C++ exceptions internally
  ; (see exception_stub.hpp). [common].build_flags' -fno-exceptions (added
  ; for the 4MB-partition flash budget, OpenEVSE/openevse_esp32_firmware#1224)
  ; reaches this whole IDF component build, not just our own sources, so
  ; esp_modem fails with "exception handling disabled". Reassert -fexceptions
  ; here -- this board is on a 16MB partition with no flash-budget need for
  ; the savings anyway -- and cancel [env]'s build_unflags so it isn't
  ; immediately stripped back out.
  -fexceptions
  ; Release builds get no -O level on core 3 (neither the platform nor the
  ; Arduino flags carry one), so -Os is needed or they compile at -O0. Core 2's
  ; framework passes -Os (tools/platformio-build-esp32.py), so this matches it.
  -Os
  ; Hybrid builds compile our sources and lib_deps with the IDF's -Werror=all,
  ; which the plain arduino envs never see. The existing -Wall findings (reorder,
  ; switch, format, ...) are warnings everywhere else, so keep them warnings here.
  -Wno-reorder
  -Wno-switch
  -Wno-delete-non-virtual-dtor
  -Wno-format
  -Wno-dangling-reference
  -Wno-mismatched-new-delete
  ; One-click crash reporting (spec section 11). Default off, so a new env
  ; cannot overflow because nobody remembered to opt out. Since the uploader
  ; moved to the browser (spec R3) it costs ~4.9 KB, so it is also on for
  ; openevse_wifi_v1, the 4 MB env with headroom to spare.
  -D ENABLE_CRASH_UPLOAD=1
build_unflags =
lib_deps =
  ${common.lib_deps}
  ${common.gfx_display_libs}
  ${common.neopixel_lib}
  ${common.ws2812fx_lib}
  ${common.lvgl_lib}
  adafruit/Adafruit MCP9808 Library @ 2.0.2
  ${core3_tsdb_common.esp_tsdb_lib}
board_build.partitions = ${common.build_partitions_16mb}
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L

[env:openevse_wifi_tft_v1_dev]
extends = env:openevse_wifi_tft_v1
build_flags =
  ${common.build_flags_openevse_tft}
  ${common.lvgl_tft_renderer_flags}
  ${common.debug_flags}
  ; Restated from openevse_wifi_tft_v1: this env replaces build_flags
  ; wholesale, so anything not repeated here is silently dropped. Without
  ; ENABLE_TSDB the dev build ran the legacy EnergyLogger instead, whose
  ; file writes on loopTask hit LittleFS compactions long enough to trip
  ; the task watchdog.
  -D ENABLE_TSDB
  -D SCHEDULER_MAX_EVENTS=16
  -D DEBUG_PORT=Serial
  -D RAPI_PORT=Serial2
  -fexceptions ; see openevse_wifi_tft_v1: espidf's esp_modem needs it; this
               ; env redefines build_flags wholesale so it doesn't inherit
               ; the parent's copy of the flag, only its build_unflags override
  ; Same -Werror=all relaxations as openevse_wifi_tft_v1 (not inherited).
  -Wno-reorder
  -Wno-switch
  -Wno-delete-non-virtual-dtor
  -Wno-format
  -Wno-dangling-reference
  -Wno-mismatched-new-delete
  ; One-click crash reporting (spec section 11). Default off, so a new env
  ; cannot overflow because nobody remembered to opt out. Since the uploader
  ; moved to the browser (spec R3) it costs ~4.9 KB, so it is also on for
  ; openevse_wifi_v1, the 4 MB env with headroom to spare.
  -D ENABLE_CRASH_UPLOAD=1
upload_protocol = custom
upload_command = curl -H "Content-Type: application/octet-stream" --data-binary "@$SOURCE" http://$UPLOAD_PORT/update
build_type = debug

# ───────────────────────────── core-3.x boards ─────────────────────────────
# openevse_wifi_v1, rebuilt on the core-3 toolchain with a 16MB partition table.
# Same feature set as the flagship openevse_wifi_v1 (PN532 + MCP9808 + NeoPixel);
# the only difference is platform = core-3 and the larger flash layout. This is
# the reference target proving the two-core build; feature work (tsdb, HA, P4,
# the S3 display boards, …) stacks on top in later PRs.
# Shared esp_tsdb lib_dep for ENABLE_TSDB targets (core-3 only). Pinned to an
# exact version, not a range: a caret would let a future minor into firmware
# builds without anyone deciding to take it. Dependency scanning still works on
# an exact pin -- `pio pkg outdated` reports Current/Wanted/Latest -- which is
# the reason this is a registry package rather than the git URL it used to be:
# a URL dep is invisible to the scanner, so a new esp_tsdb release went
# unnoticed until someone happened to look.
#
# v2.4.0 was the first release with the sidecar header write. Before it, the
# database header was rewritten in place on every sample, and because LittleFS
# stores a file as a CTZ skip-list a write at offset 0 rewrites the whole file
# (~20 ms/KB) -- so once energy.tsdb passed ~170 KB the write exceeded
# CONFIG_ESP_TASK_WDT_TIMEOUT_S=5 and the unit boot-looped (#1207). Do not move
# this pin back below v2.4.0.
[core3_tsdb_common]
esp_tsdb_lib = rar/esp_tsdb@2.4.4

[env:openevse_wifi_v1_16mb]
board = esp32dev
platform = ${common.platform_core3}
# Hybrid build (arduino+espidf), same as openevse_wifi_tft_v1, but with NO
# board_build.cmake_extra_args: this env gets only the shared sdkconfig.defaults
# (16MB flash, stock mbedTLS) and deliberately skips the sdkconfig.defaults.tls
# overlay — no TLS dynamic-buffer/wrap here, unlike the TFT env.
framework = arduino, espidf
lib_deps =
  ${common.lib_deps}
  ${common.neopixel_lib}
  adafruit/Adafruit MCP9808 Library @ 2.0.2
  ${core3_tsdb_common.esp_tsdb_lib}
build_flags =
  ${common.build_flags}
  ${common.debug_flags}
  -D ENABLE_TSDB
  -D NEO_PIXEL_PIN=17
  -D NEO_PIXEL_LENGTH=14
  -D WIFI_PIXEL_NUMBER=1
  -D WIFI_BUTTON=0
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  -D RAPI_PORT=Serial
  -D DEBUG_PORT=Serial1
  -D I2C_SDA=21
  -D I2C_SCL=22
  -D ENABLE_MCP9808
  -D ENABLE_PN532
  -D TX1=16
  ; Cable NTC thermistor monitoring ($GN/$SN/$FF C, controller firmware
  ; 9.4.0+). Opt-in per env, NOT in common.build_flags: it costs ~7.5KB of
  ; flash and every 4MB env (min_spiffs.csv) is already at ~99.7% of its app
  ; partition, so enabling it there overflows the build. Only the two 16MB
  ; envs have the room. Revisit if the 4MB image ever gets a diet.
  -D ENABLE_CABLE_TEMP
  ; Hybrid espidf build; espressif__esp_modem needs exceptions -- see the
  ; matching comment on openevse_wifi_tft_v1 above.
  -fexceptions
  ; Release builds get no -O level on core 3 (neither the platform nor the
  ; Arduino flags carry one), so -Os is needed or they compile at -O0. Core 2's
  ; framework passes -Os (tools/platformio-build-esp32.py), so this matches it.
  -Os
  ; Hybrid builds compile our sources and lib_deps with the IDF's -Werror=all,
  ; which the plain arduino envs never see. The existing -Wall findings (reorder,
  ; switch, format, ...) are warnings everywhere else, so keep them warnings here.
  -Wno-reorder
  -Wno-switch
  -Wno-delete-non-virtual-dtor
  -Wno-format
  -Wno-dangling-reference
  -Wno-mismatched-new-delete
  ; One-click crash reporting (spec section 11). Default off, so a new env
  ; cannot overflow because nobody remembered to opt out. Since the uploader
  ; moved to the browser (spec R3) it costs ~4.9 KB, so it is also on for
  ; openevse_wifi_v1, the 4 MB env with headroom to spare.
  -D ENABLE_CRASH_UPLOAD=1
build_unflags =
board_build.partitions = openevse_16mb.csv
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L

