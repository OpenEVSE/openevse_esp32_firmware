; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html


; Build options
;
; Build features
; - ENABLE_DEBUG - Turn on general debug options
; - ENABLE_DEBUG_WEB - Enable debug of the web server (noisy)
; - ENABLE_DEBUG_RAPI - Enable debug of the RAPI code (noisy)
; - ENABLE_PROFILE - Turn on the profiling
; - ENABLE_OTA - Enable Arduino OTA update
; - ENABLE_ASYNC_WIFI_SCAN - Enable use of the async WiFI scanning, requires Git version of ESP core
;
; Config
; - WIFI_LED - Define the pin to use for (and enable) WiFi status LED notifications
; - DEBUG_PORT - The port to use for debug messages, Serial is used for RAPI so if connected to an
;                OpenEVSE you

[platformio]
data_dir = src/data
default_envs = openevse_wifi_v1

[common]
# core-3.x platform for 16MB+ boards (pioarduino / Arduino-ESP32 3.x on ESP-IDF 5.x).
# 4MB boards stay on the core-2.x default ([env] platform = espressif32@6.12.0).
# Envs that want core-3 set: platform = ${common.platform_core3}
platform_core3 = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
lib_deps =
  bblanchon/ArduinoJson@6.20.1
  https://github.com/jeremypoulter/ArduinoMongoose.git#ca0a817de014cf4ab1833b32383532366fca10d7  ; master: mbedTLS-3 port + unique SUBSCRIBE ids + TLS teardown UAF fix (97ff3b4)
  jeremypoulter/Micro Debug@0.0.5
  jeremypoulter/ConfigJson@0.0.6
  https://github.com/OpenEVSE/OpenEVSE_Lib.git#v0.0.20  ; OpenEVSE library with D9 command support (protocol-gated)
  jeremypoulter/ESPAL@0.0.7
  jeremypoulter/StreamSpy@0.0.2
  jeremypoulter/MicroTasks@0.0.4
  matth-x/MicroOcpp@1.2.0
  matth-x/MicroOcppMongoose@1.2.0
lib_ignore = WebSockets ; MicroOcpp: don't compile built-in WS library
extra_scripts =
  pre:scripts/auto_fw_version.py
  scripts/extra_script.py
debug_flags =
  -ggdb
  -D ENABLE_FULL_RAPI
  -D ENABLE_DEBUG
  #-D ENABLE_DEBUG_WEB
  #-D ENABLE_DEBUG_WEB_REQUEST
  #-D ENABLE_DEBUG_SCHEDULER
  #-D ENABLE_DEBUG_TIME
  -D ENABLE_DEBUG_EVSE_MAN
  #-D ENABLE_DEBUG_EVSE_MONITOR
  #-D ENABLE_DEBUG_DIVERT
  #-D ENABLE_DEBUG_LED
  #-D ENABLE_DEBUG_LCD
  #-D ENABLE_DEBUG_MQTT
  #-D ENABLE_DEBUG_EMONCMS
  #-D ENABLE_DEBUG_TESLA_CLIENT
  #-D ENABLE_DEBUG_LIMIT
  #-D ENABLE_PROFILE
  #-D ENABLE_DEBUG_HTTP_UPATE
  #-D ENABLE_NOISY_PROFILE
  #-D ENABLE_DEBUG_MICROTASKS
  #-D ENABLE_DEBUG_ENERGY_METER
  #-D ENABLE_DEBUG_MEMORY_MONITOR
  #-D ENABLE_DEBUG_CETRIFICATES
  #-D ENABLE_DEBUG_WEB_CETRIFICATES
  #-D ENABLE_DEBUG_MONGOOSE_MQTT_CLIENT
  #-D ENABLE_DEBUG_SCREEN_MANAGER
  #-D ENABLE_DEBUG_SCREEN_RENDERER
  #-D ENABLE_DEBUG_SCREEN_CHARGE
  #-D ENABLE_DEBUG_SCREEN_BOOT
feature_flags =
  -D MG_ENABLE_SSL=1
  -D MG_ENABLE_HTTP_STREAMING_MULTIPART=1
  -D MG_ENABLE_EXTRA_ERRORS_DESC=1
  #-D ARDUINO_MONGOOSE_DEFAULT_STREAM_BUFFER=2048
  #-D ARDUINO_MONGOOSE_SEND_BUFFER_SIZE=2048
  #-D ENABLE_DEBUG
  #-D CS_ENABLE_DEBUG
  #-D MBEDTLS_DEBUG_C
  -D MG_ENABLE_SNTP=1
  #-D ENABLE_DEBUG_MICROTASKS
  -D MO_CUSTOM_WS ; MicroOcpp: don't use built-in WS library
  -D MO_CUSTOM_CONSOLE ; MicroOcpp: use custom debug out
  -D MO_DBG_LEVEL=MO_DL_INFO
  -D MO_TRAFFIC_OUT
  -D MO_MG_VERSION_614 ; use MG v6.14
  #-D ENABLE_DEBUG
  #-D ENABLE_DEBUG_MONGOOSE_HTTP_CLIENT
  -D RAPI_MAX_COMMANDS=20
  -D BUILD_ENV_NAME="$PIOENV"
  -D MG_MAX_HTTP_REQUEST_SIZE=8196

build_flags =
  -D ESP32
  -D ARDUINO_ARCH_ESP32
  -D USE_ESP32
  -D USE_ESP32_FRAMEWORK_ARDUINO
  -D CS_PLATFORM=CS_P_ESP32
  -D MG_SSL_IF=MG_SSL_IF_MBEDTLS
  -D MG_SSL_IF_MBEDTLS_FREE_CERTS=1
  #-D MG_SSL_IF_MBEDTLS_MAX_FRAG_LEN=2048
  ${common.feature_flags}

build_flags_openevse_tft =
  ${common.build_flags}
  ${common.gfx_display_hw_flags}
  -D TFT_BACKLIGHT_CHARGING_THRESHOLD=0.1
  -D NEO_PIXEL_PIN=26
  -D NEO_PIXEL_LENGTH=4
  -D WIFI_PIXEL_NUMBER=1
  -D WIFI_BUTTON=0
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  -D I2C_SDA=22
  -D I2C_SCL=21
  -D ENABLE_WS2812FX
  -D ENABLE_MCP9808
  -D ENABLE_PN532
  ; UART2 pins, pinned explicitly. Both TFT envs put something on Serial2 --
  ; the release env its debug console, the _dev env the RAPI link to the
  ; OpenEVSE -- and neither can rely on the core's default any more:
  ; arduino-esp32 2.0.17 defaulted ESP32 UART2 to RX2=16/TX2=17, but 3.x
  ; (HardwareSerial.h, "Default pins for UART2 are arbitrary") changed it to
  ; RX2=4/TX2=25. Nothing is wired to 4/25 on this board, so begin() succeeds
  ; on dead pins and the only symptom is silence -- for _dev that reads as
  ; "OpenEVSE not responding or not connected". The ch_denky variant defines
  ; no RX2/TX2 of its own, so this is the only thing holding the pins.
  -D RX2=16
  -D TX2=17
build_partitions = min_spiffs.csv
build_partitions_debug = min_spiffs_debug.csv
build_partitions_16mb = openevse_16mb.csv

neopixel_lib = adafruit/Adafruit NeoPixel@1.15.5
ws2812fx_lib = kitesurfer1404/WS2812FX@1.4.7

gfx_display_libs =
#  lvgl/lvgl@^8.3.9
  bodmer/TFT_eSPI@^2.5.43
  bitbank2/PNGdec@^1.1.5
  SPI

# TFT panel hardware (ILI9488 driver, pins, SPI) WITHOUT enabling any on-device
# renderer. Shared by the legacy TFT_eSPI renderer and the LVGL renderer.
gfx_display_hw_flags =
  -D USER_SETUP_LOADED
  -D ILI9488_DRIVER
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_BL=27
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TOUCH_CS=33
#  -D LOAD_GLCD
#  -D LOAD_FONT2
#  -D LOAD_FONT4
#  -D LOAD_FONT6
#  -D LOAD_FONT7
#  -D LOAD_FONT8
  -D LOAD_GFXFF
#  -D SMOOTH_FONT
#  -D SPI_FREQUENCY=15999999
#  -D SPI_FREQUENCY=20000000
#  -D SPI_FREQUENCY=27000000
  -D SPI_FREQUENCY=40000000
#  -D SPI_FREQUENCY=55000000
#  -D SPI_FREQUENCY=65000000
#  -D SPI_FREQUENCY=80000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=600000

# LVGL renderer (src/lcd_lvgl.cpp, src/lvgl_tft/). This is the renderer for the
# stock ILI9488 TFT — the openevse_wifi_tft_v1.* envs default it on via this
# fragment. TFT_eSPI is still the low-level ILI9488 SPI driver underneath.
lvgl_tft_renderer_flags =
  -D ENABLE_SCREEN_LVGL_TFT
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_CONF_SUPPRESS_DEFINE_CHECK
  -D LCD_BACKLIGHT_TIMEOUT_DEFAULT=600  # idle-timeout default for the LVGL TFT (seconds)
  -I src/lvgl_tft

# Legacy TFT_eSPI immediate-mode renderer (src/screens/, src/lcd_tft.cpp).
# Superseded by the LVGL renderer on the stock TFT; retained in-tree for the
# Elecrow ESP32 HMI board (env:elecrow_esp32_hmi_dev), which still selects it.
gfx_display_build_flags =
  ${common.gfx_display_hw_flags}
  -D ENABLE_SCREEN_LCD_TFT

[env]
# specify exact Arduino ESP SDK version, requires platformio 3.5+ (curently dev version)
# http://docs.platformio.org/en/latest/projectconf/section_env_general.html#platform
#platform = https://github.com/platformio/platform-espressif32.git#feature/stage
#platform = https://github.com/platformio/platform-espressif32.git#develop
#platform = espressif32@1.11.1
platform = espressif32@7.0.1
#framework = arduino, espidf
framework = arduino
lib_deps = ${common.lib_deps}
lib_ignore = ${common.lib_ignore}
build_flags = ${common.build_flags}
#upload_port = openevse.local
upload_speed = 921600
extra_scripts = ${common.extra_scripts}
board_build.partitions = ${common.build_partitions}
#platform_packages =
#  ; use a special branch
#  framework-arduinoespressif32 @ https://github.com/marcovannoord/arduino-esp32.git#idf-release/v4.0
#    platformio/framework-arduinoespressif32 @ ~3.10006.0
monitor_speed = 115200
monitor_filters =
  esp32_exception_decoder

