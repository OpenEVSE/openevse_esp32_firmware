[env:openevse_wifi_tft_v1]
board = denky32
platform = ${common.platform_core3}
# Arduino as an ESP-IDF component ("hybrid" build): the ESP-IDF is compiled
# from source (5.5.4 — the same IDF the prebuilt Arduino libs were built from,
# so the resolved sdkconfig is bit-identical apart from the deliberate deltas
# below) instead of being consumed as a prebuilt static-library bundle.
#
# Why: sdkconfig options are REAL Kconfig here, resolved by kconfgen against
# the IDF's own Kconfig tree. Concretely that means an option which exists
# actually takes effect instead of being a decorative line, its dependencies
# are resolved for real, and anything it selects comes along automatically
# (enabling CONFIG_MBEDTLS_DYNAMIC_BUFFER pulled in
# CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT=y unasked). An unsatisfiable dependency
# on a real symbol is visible in the resolved sdkconfig.<env>, so you can see
# what you actually got. What this does NOT buy you: a symbol name that does
# not exist at all is still dropped in silence, exactly as on the prebuilt
# path — negative-tested 2026-08-25 with CONFIG_MBEDTLS_DYNAMIC_FREE_PEER_CERT,
# build SUCCESS with no warning. Always confirm an option landed by grepping
# the generated sdkconfig.<env>, never by the build exiting 0.
#
# The concrete payoff: enabling CONFIG_MBEDTLS_DYNAMIC_BUFFER now actually
# rebuilds mbedtls with its own linker wrap flags for the mbedtls_ssl_*
# symbols. Without this the option is inert (pioarduino's prebuilt path
# silently drops such flags), and getting it would otherwise mean carrying 12
# hand-written linker wrap flags as build_flags.
# See docs/superpowers/specs/2026-08-25-arduino-idf-component-design.md
# and .superpowers/sdd/2026-08-25-arduino-idf-component/spike-report.md §4.
#
# `custom_sdkconfig` does NOT work in this mode (pioarduino gates it off when
# "espidf" is in the framework list). The mechanism is the committed seed
# files: sdkconfig.defaults (shared base) plus, for this env, the
# sdkconfig.defaults.tls overlay selected via SDKCONFIG_DEFAULTS below.
#
# HAZARD: sdkconfig.<env> is the authority once generated. After editing any
# seed file you MUST delete sdkconfig.openevse_wifi_tft_v1 (or run
# `pio run -t fullclean`) or the edit silently does nothing.
framework = arduino, espidf
# NOTE: no whitespace before the `;` separating the SDKCONFIG_DEFAULTS list
# entries. PlatformIO's configparser treats " ;" as an inline comment and would
# truncate the line without complaint, dropping the TLS overlay entirely
# (symptom: the __wrap_mbedtls_ssl_* symbols vanish from firmware.elf).
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.tls
build_flags =
  ${common.build_flags_openevse_tft}
  ${common.lvgl_tft_renderer_flags}
  -D ENABLE_TSDB
  -D DEBUG_PORT=Serial2
  -D RAPI_PORT=Serial
  ; This board has no PSRAM and runs with ~60KB free heap, so it takes a
  ; smaller schedule table than the 50-entry default. 16 is well clear of any
  ; usage seen in the field and returns ~4.3KB of .bss.
  -D SCHEDULER_MAX_EVENTS=16
  ; NB: raising ARDUINO_MONGOOSE_DEFAULT_STREAM_BUFFER was tried and reverted.
  ; At 4096 it did remove the realloc ladder, but every response -- including
  ; the 2-byte "{}" ones -- then reserved 4KB up front, and with a handful of
  ; concurrent connections that cost more than the fragmentation it cured
  ; (measured: /override went from 0 to 4,096 bytes of largest-block drop).
  ; The handlers that emit large bodies serialise into a right-sized buffer
  ; and write once instead; see handleStatus and handleConfigGet.
  ; This is a hybrid Arduino-as-ESP-IDF-component build (`framework = arduino,
  ; espidf` above): the espidf managed component tree it pulls in includes
  ; espressif__esp_modem, which genuinely uses C++ exceptions internally
  ; (see exception_stub.hpp). [common].build_flags' -fno-exceptions (added
  ; for the 4MB-partition flash budget, OpenEVSE/openevse_esp32_firmware#1224)
  ; reaches this whole IDF component build, not just our own sources, so
  ; esp_modem fails with "exception handling disabled". Reassert -fexceptions
  ; here -- this board is on a 16MB partition with no flash-budget need for
  ; the savings anyway -- and cancel [env]'s build_unflags so it isn't
  ; immediately stripped back out.
  -fexceptions
build_unflags =
lib_deps =
  ${common.lib_deps}
  ${common.gfx_display_libs}
  ${common.neopixel_lib}
  ${common.ws2812fx_lib}
  ${common.lvgl_lib}
  adafruit/Adafruit MCP9808 Library @ 2.0.2
  ${core3_tsdb_common.esp_tsdb_lib}
board_build.partitions = ${common.build_partitions_16mb}
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L

[env:openevse_wifi_tft_v1_dev]
extends = env:openevse_wifi_tft_v1
build_flags =
  ${common.build_flags_openevse_tft}
  ${common.lvgl_tft_renderer_flags}
  ${common.debug_flags}
  -D DEBUG_PORT=Serial
  -D RAPI_PORT=Serial2
  -fexceptions ; see openevse_wifi_tft_v1: espidf's esp_modem needs it; this
               ; env redefines build_flags wholesale so it doesn't inherit
               ; the parent's copy of the flag, only its build_unflags override
upload_protocol = custom
upload_command = curl -F firmware=@$SOURCE http://$UPLOAD_PORT/update
build_type = debug

# ESP32-S3-WROOM-1U-N16R8 WiFi/LCD board — 16MB flash, 8MB *octal* PSRAM, ILI9488
# on FSPI, 4x WS2812B, MCP9808, DS3231 (no driver yet), no RFID, no touch, no ADC.
# Full pin map and the v1.2/v1.3 differences: docs/hardware/esp32-s3-lcd.md.
# S3 needs the core-3 toolchain; there is no core-2 fallback for this board.
[env:openevse_s3_lcd]
# boards/openevse_s3_lcd.json: 16MB quad flash + 8MB octal PSRAM (memory_type
# qio_opi), USB-Serial-JTAG, and the openevse_16mb.csv dual-OTA layout.
board = openevse_s3_lcd
platform = ${common.platform_core3}
# Arduino as an ESP-IDF component (see the openevse_wifi_tft_v1 env): IDF is
# built from source against its own S3 seed (sdkconfig.defaults.esp32s3) with
# the board overlay (sdkconfig.defaults.s3lcd: octal PSRAM, qio flash, WiFi/
# lwIP/mbedTLS in PSRAM, BT off) and the shared TLS overlay on top. No
# whitespace before the `;` separators.
framework = arduino, espidf
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.esp32s3;sdkconfig.defaults.s3lcd;sdkconfig.defaults.tls
build_flags =
  ${common.build_flags_openevse_s3_lcd}
  ${common.lvgl_tft_renderer_flags}
  -D ENABLE_TSDB
  -D DEBUG_PORT=Serial
  -D RAPI_PORT=Serial1
# Cancel [env]'s `build_unflags = -fexceptions`, which would otherwise strip
# the flag the shared S3 block just asserted back out. Inherited by the _dev
# and _heapdebug envs, which do not redefine it.
build_unflags =
lib_deps =
  ${common.lib_deps}
  ${common.gfx_display_libs}
  ${common.neopixel_lib}
  ${common.ws2812fx_lib}
  lvgl/lvgl@^8.3.9
  adafruit/Adafruit MCP9808 Library @ 2.0.2
  ${core3_tsdb_common.esp_tsdb_lib}
board_build.partitions = ${common.build_partitions_16mb}

[env:openevse_s3_lcd_dev]
extends = env:openevse_s3_lcd
build_flags =
  ${common.build_flags_openevse_s3_lcd}
  ${common.lvgl_tft_renderer_flags}
  ${common.debug_flags}
  -D ENABLE_DEBUG_NFCREADER
  -D ENABLE_TSDB
  -D DEBUG_PORT=Serial
  -D RAPI_PORT=Serial1
build_type = debug

# Heap-corruption trap build of the dev env: comprehensive poisoning
# (sdkconfig.defaults.heapdebug) + a 10 s heap_caps_check_integrity_all() tick
# in loop(). Flash this when a board has taken an unexplained memory panic and
# the core dump only shows the victim; it aborts within a tick of the write
# and names the poisoned address. Delete sdkconfig.openevse_s3_lcd_heapdebug
# after editing any overlay so the seed is regenerated.
[env:openevse_s3_lcd_heapdebug]
extends = env:openevse_s3_lcd_dev
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.esp32s3;sdkconfig.defaults.s3lcd;sdkconfig.defaults.tls;sdkconfig.defaults.heapdebug
build_flags =
  ${env:openevse_s3_lcd_dev.build_flags}
  -D HEAP_DEBUG_INTEGRITY

# ───────────────────────────── core-3.x boards ─────────────────────────────
# openevse_wifi_v1, rebuilt on the core-3 toolchain with a 16MB partition table.
# Same feature set as the flagship openevse_wifi_v1 (PN532 + MCP9808 + NeoPixel);
# the only difference is platform = core-3 and the larger flash layout. This is
# the reference target proving the two-core build; feature work (tsdb, HA, P4,
# the S3 display boards, …) stacks on top in later PRs.
# Shared esp_tsdb lib_dep for ENABLE_TSDB targets (core-3 only). Pinned to an
# exact version, not a range: a caret would let a future minor into firmware
# builds without anyone deciding to take it. Dependency scanning still works on
# an exact pin -- `pio pkg outdated` reports Current/Wanted/Latest -- which is
# the reason this is a registry package rather than the git URL it used to be:
# a URL dep is invisible to the scanner, so a new esp_tsdb release went
# unnoticed until someone happened to look.
#
# v2.4.0 was the first release with the sidecar header write. Before it, the
# database header was rewritten in place on every sample, and because LittleFS
# stores a file as a CTZ skip-list a write at offset 0 rewrites the whole file
# (~20 ms/KB) -- so once energy.tsdb passed ~170 KB the write exceeded
# CONFIG_ESP_TASK_WDT_TIMEOUT_S=5 and the unit boot-looped (#1207). Do not move
# this pin back below v2.4.0.
[core3_tsdb_common]
esp_tsdb_lib = rar/esp_tsdb@2.4.3

[env:openevse_wifi_v1_16mb]
board = esp32dev
platform = ${common.platform_core3}
# Hybrid build (arduino+espidf), same as openevse_wifi_tft_v1, but with NO
# board_build.cmake_extra_args: this env gets only the shared sdkconfig.defaults
# (16MB flash, stock mbedTLS) and deliberately skips the sdkconfig.defaults.tls
# overlay — no TLS dynamic-buffer/wrap here, unlike the TFT env.
framework = arduino, espidf
lib_deps =
  ${common.lib_deps}
  ${common.neopixel_lib}
  adafruit/Adafruit MCP9808 Library @ 2.0.2
  ${core3_tsdb_common.esp_tsdb_lib}
build_flags =
  ${common.build_flags}
  ${common.debug_flags}
  -D ENABLE_TSDB
  -D NEO_PIXEL_PIN=17
  -D NEO_PIXEL_LENGTH=14
  -D WIFI_PIXEL_NUMBER=1
  -D WIFI_BUTTON=0
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  -D RAPI_PORT=Serial
  -D DEBUG_PORT=Serial1
  -D I2C_SDA=21
  -D I2C_SCL=22
  -D ENABLE_MCP9808
  -D ENABLE_PN532
  -D TX1=16
  ; Cable NTC thermistor monitoring ($GN/$SN/$FF C, controller firmware
  ; 9.4.0+). Opt-in per env, NOT in common.build_flags: it costs ~7.5KB of
  ; flash and every 4MB env (min_spiffs.csv) is already at ~99.7% of its app
  ; partition, so enabling it there overflows the build. Only the two 16MB
  ; envs have the room. Revisit if the 4MB image ever gets a diet.
  -D ENABLE_CABLE_TEMP
  ; Hybrid espidf build; espressif__esp_modem needs exceptions -- see the
  ; matching comment on openevse_wifi_tft_v1 above.
  -fexceptions
build_unflags =
board_build.partitions = openevse_16mb.csv
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L

# ───────────────────────── host-side unit test harness ─────────────────────
# Runs pure, framework-free logic on the build host. Run with: pio test -e native_test
# Feature PRs add their own doctest suites under test/; this env just hosts them.
# home_battery.cpp is a pure store, so it is compiled into the suites that need it
