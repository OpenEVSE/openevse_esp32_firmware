; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html


; Build options
;
; Build features
; - ENABLE_DEBUG - Turn on general debug options
; - ENABLE_DEBUG_WEB - Enable debug of the web server (noisy)
; - ENABLE_DEBUG_RAPI - Enable debug of the RAPI code (noisy)
; - ENABLE_PROFILE - Turn on the profiling
; - ENABLE_OTA - Enable Arduino OTA update
; - ENABLE_ASYNC_WIFI_SCAN - Enable use of the async WiFI scanning, requires Git version of ESP core
;
; Config
; - WIFI_LED - Define the pin to use for (and enable) WiFi status LED notifications
; - DEBUG_PORT - The port to use for debug messages, Serial is used for RAPI so if connected to an
;                OpenEVSE you

[platformio]
data_dir = src/data
default_envs = openevse_wifi_v1

[common]
# core-3.x platform for 16MB+ boards (pioarduino / Arduino-ESP32 3.x on ESP-IDF 5.x).
# 4MB boards stay on the core-2.x default ([env] platform = espressif32@6.12.0).
# Envs that want core-3 set: platform = ${common.platform_core3}
platform_core3 = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
lib_deps =
  bblanchon/ArduinoJson@6.20.1
  https://github.com/jeremypoulter/ArduinoMongoose.git#ca0a817de014cf4ab1833b32383532366fca10d7  ; master: mbedTLS-3 port + unique SUBSCRIBE ids + TLS teardown UAF fix (97ff3b4)
  jeremypoulter/Micro Debug@0.0.5
  jeremypoulter/ConfigJson@0.0.8
  openevse/OpenEVSE@0.0.24  ; PlatformIO registry package (was a git+tag pin) - D9 command support (protocol-gated) + relay-health $GL/$FH/$FK, 2-line LCD backlight type setter
  jeremypoulter/ESPAL@0.0.7
  jeremypoulter/StreamSpy@0.0.2
  jeremypoulter/MicroTasks@0.0.4
  matth-x/MicroOcpp@1.2.0
  matth-x/MicroOcppMongoose@1.2.0
lib_ignore = WebSockets ; MicroOcpp: don't compile built-in WS library
extra_scripts =
  pre:scripts/auto_fw_version.py
  scripts/extra_script.py
debug_flags =
  -ggdb
  -D ENABLE_FULL_RAPI
  -D ENABLE_DEBUG
  -D ENABLE_OTA
  #-D ENABLE_DEBUG_WEB
  #-D ENABLE_DEBUG_WEB_REQUEST
  #-D ENABLE_DEBUG_SCHEDULER
  #-D ENABLE_DEBUG_TIME
  #-D ENABLE_DEBUG_EVSE_MAN
  #-D ENABLE_DEBUG_EVSE_MONITOR
  #-D ENABLE_DEBUG_DIVERT
  #-D ENABLE_DEBUG_LED
  #-D ENABLE_DEBUG_LCD
  #-D ENABLE_DEBUG_MQTT
  #-D ENABLE_DEBUG_EMONCMS
  #-D ENABLE_DEBUG_TESLA_CLIENT
  #-D ENABLE_DEBUG_LIMIT
  #-D ENABLE_PROFILE
  #-D ENABLE_DEBUG_HTTP_UPATE
  #-D ENABLE_NOISY_PROFILE
  #-D ENABLE_DEBUG_MICROTASKS
  #-D ENABLE_DEBUG_ENERGY_METER
  #-D ENABLE_DEBUG_MEMORY_MONITOR
  #-D ENABLE_DEBUG_CETRIFICATES
  #-D ENABLE_DEBUG_WEB_CETRIFICATES
  #-D ENABLE_DEBUG_MONGOOSE_MQTT_CLIENT
  #-D ENABLE_DEBUG_SCREEN_MANAGER
  #-D ENABLE_DEBUG_SCREEN_RENDERER
  #-D ENABLE_DEBUG_SCREEN_CHARGE
  #-D ENABLE_DEBUG_SCREEN_BOOT
  #-D ENABLE_DEBUG_LOADSHARING_DISCOVERY
  #-D ENABLE_DEBUG_LOADSHARING_POLLER
feature_flags =
  -D MG_ENABLE_SSL=1
  -D MG_ENABLE_HTTP_STREAMING_MULTIPART=1
  -D MG_ENABLE_EXTRA_ERRORS_DESC=1
  #-D ARDUINO_MONGOOSE_DEFAULT_STREAM_BUFFER=2048
  #-D ARDUINO_MONGOOSE_SEND_BUFFER_SIZE=2048
  #-D ENABLE_DEBUG
  #-D CS_ENABLE_DEBUG
  #-D MBEDTLS_DEBUG_C
  -D MG_ENABLE_SNTP=1
  #-D ENABLE_DEBUG_MICROTASKS
  -D MO_CUSTOM_WS ; MicroOcpp: don't use built-in WS library
  -D MO_CUSTOM_CONSOLE ; MicroOcpp: use custom debug out
  ; Dropping MO_DBG_LEVEL from INFO to WARN (and dropping MO_TRAFFIC_OUT,
  ; the raw OCPP message dump) reclaims ~5.9KB of flash on the 4MB boards --
  ; material when openevse_wifi_v1 is within a few KB of its partition limit.
  ; WARN still surfaces the lost-transaction/auth-conflict/fs-access cases
  ; that show up on the web debug console; only the routine "state changed"
  ; / "message sent" INFO narration and the wire-traffic dump are dropped.
  -D MO_DBG_LEVEL=MO_DL_WARN
  -D MO_MG_VERSION_614 ; use MG v6.14
  #-D ENABLE_DEBUG
  #-D ENABLE_DEBUG_MONGOOSE_HTTP_CLIENT
  -D RAPI_MAX_COMMANDS=20
  -D BUILD_ENV_NAME="$PIOENV"
  -D MG_MAX_HTTP_REQUEST_SIZE=8196

build_flags =
  -fno-exceptions ; paired with [env]'s `build_unflags = -fexceptions` above
  ; NB: no `-D ESP32` here -- the Arduino framework already defines it, and on
  ; the two platforms it does so with different values: core-2.x defines it
  ; bare (= 1) while core-3.x/pioarduino has arduino-esp32 export
  ; `-DESP32=ESP32` from its CMakeLists as a PUBLIC compile option. Adding our
  ; own bare `-D ESP32` on top of that made gcc warn `"ESP32" redefined` for
  ; every core-3 translation unit. Nothing here tests ESP32 arithmetically
  ; (only #ifdef / defined()), so the framework's definition is all we need.
  -D ARDUINO_ARCH_ESP32
  -D USE_ESP32
  -D USE_ESP32_FRAMEWORK_ARDUINO
  -D CS_PLATFORM=CS_P_ESP32
  -D MG_SSL_IF=MG_SSL_IF_MBEDTLS
  -D MG_SSL_IF_MBEDTLS_FREE_CERTS=1
  #-D MG_SSL_IF_MBEDTLS_MAX_FRAG_LEN=2048
  ${common.feature_flags}

build_flags_openevse_tft =
  ${common.build_flags}
  ${common.gfx_display_hw_flags}
  ; Cable NTC thermistor monitoring ($GN/$SN/$FF C, controller firmware
  ; 9.4.0+). Opt-in per env, NOT in common.build_flags: it costs ~7.5KB of
  ; flash and every 4MB env (min_spiffs.csv) is already at ~99.7% of its app
  ; partition, so enabling it there overflows the build. Only the two 16MB
  ; envs have the room. Revisit if the 4MB image ever gets a diet.
  -D ENABLE_CABLE_TEMP
  -D TFT_BACKLIGHT_CHARGING_THRESHOLD=0.1
  -D NEO_PIXEL_PIN=26
  -D NEO_PIXEL_LENGTH=4
  -D WIFI_PIXEL_NUMBER=1
  -D WIFI_BUTTON=0
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  -D I2C_SDA=22
  -D I2C_SCL=21
  -D ENABLE_WS2812FX
  -D ENABLE_MCP9808
  -D ENABLE_PN532
  ; UART2 pins, pinned explicitly. Both TFT envs put something on Serial2 --
  ; the release env its debug console, the _dev env the RAPI link to the
  ; OpenEVSE -- and neither can rely on the core's default any more:
  ; arduino-esp32 2.0.17 defaulted ESP32 UART2 to RX2=16/TX2=17, but 3.x
  ; (HardwareSerial.h, "Default pins for UART2 are arbitrary") changed it to
  ; RX2=4/TX2=25. Nothing is wired to 4/25 on this board, so begin() succeeds
  ; on dead pins and the only symptom is silence -- for _dev that reads as
  ; "OpenEVSE not responding or not connected". The ch_denky variant defines
  ; no RX2/TX2 of its own, so this is the only thing holding the pins.
  -D RX2=16
  -D TX2=17

# ESP32-S3 WiFi/LCD board (env:openevse_s3_lcd). See docs/hardware/esp32-s3-lcd.md.
# Same ILI9488 panel and LVGL renderer as the stock TFT board, different silicon and
# a different pin map. PN532 RFID is an external I2C module; no touch.
build_flags_openevse_s3_lcd =
  ${common.build_flags}
  ${common.gfx_display_hw_flags_s3_lcd}
  -D TFT_BACKLIGHT_CHARGING_THRESHOLD=0.1
  -D NEO_PIXEL_PIN=18
  -D NEO_PIXEL_LENGTH=4
  -D WIFI_PIXEL_NUMBER=1
  -D WIFI_BUTTON=0
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  -D I2C_SDA=8
  -D I2C_SCL=9
  # UART1 to the OpenEVSE controller on JP1.
  #
  # TX1/RX1 are NOT a redundant restatement of the pin map -- do not delete them as
  # duplication. HardwareSerial.h guards with `#ifndef RX1`, the esp32s3 variant does
  # not define them, and the core's S3 fallback is RX1=15 / TX1=16. IO15 is BL_PWM:
  # without this override Serial1.begin() attaches the RAPI receiver to the backlight
  # FET, and TX lands on IO16 (unrouted on v1.2, PWR_ST on v1.3).
  #
  # RX also needs the internal pull-up: the level shifter is a bare diode with its
  # anode on the GPIO, so nothing pulls the line back up (v1.2 boards; v1.3 fits 10k
  # externally and this becomes a no-op).
  -D TX1=1
  -D RX1=2
  -D RAPI_RX_PULLUP=2
  # Discrete RAPI traffic LEDs, fitted from v1.6.1: LED6 red on IO45 (TX), LED7
  # yellow on IO46 (RX), each an anode through 1k to GND -- so active HIGH, which
  # is mandatory rather than a preference. Both are strapping pins and an LED to
  # GND cannot lift either above its forward voltage, so the reset latch still
  # samples 0. See src/rapi_activity_led.h. (LED5, the green PWR, sits after the
  # buck on the 3.3 V rail and reaches no GPIO by design -- do not model it.)
  #
  # Harmless on the v1.2/v1.3 boards, where IO45/IO46 are unrouted castellations.
  -D RAPI_TX_LED=45
  -D RAPI_RX_LED=46
  -D ENABLE_WS2812FX
  -D ENABLE_MCP9808
  # PN532 RFID reader on the same I2C bus (0x24), plugged into the I2C header.
  -D ENABLE_PN532
  # Responses are drained ARDUINO_MONGOOSE_SEND_BUFFER_SIZE bytes per send
  # event, and a send event lands once per main-loop poll: at the 256-byte
  # default a 100 KB asset needs ~400 polls (1.7 s measured). 2 KB per open
  # connection is nothing on a board with PSRAM. 5744 = one lwIP send buffer
  # (CONFIG_LWIP_TCP_SND_BUF_DEFAULT), so each pass hands the socket all it takes.
  -D ARDUINO_MONGOOSE_SEND_BUFFER_SIZE=5744
  # DS3231MZ + CR2032 on the same I2C bus. Not a convenience: the tsdb logger
  # discards samples until wall-clock passes its validity floor, and this board
  # loses power with the EVSE -- worst exactly when WiFi is down too and NTP
  # never answers. See src/rtc_ds3231.h.
  -D ENABLE_DS3231
  # microSD (J2 + R33 fitted on both revisions), SDMMC 1-bit -- DAT1/DAT2 reach
  # no GPIO, so 1-bit is the only mode, not a fallback. When a card is present
  # the energy log lives on it; with no card the existing internal-flash tsdb
  # path is used unchanged. See src/sd_card.h.
  -D ENABLE_SD_CARD
  # LVGL's widget/render pool goes to PSRAM on this board. Set per-env rather
  # than from BOARD_HAS_PSRAM: that symbol comes from the board definition and
  # the stock TFT board's denky32 sets it with no PSRAM fitted. See lv_conf.h.
  -D LVGL_POOL_IN_PSRAM
  # LVGL draw buffer: 32 lines (~30 KB internal DRAM). master dropped the stock
  # board to 16 for heap headroom; this board keeps the network stack in PSRAM.
  -D DRAW_BUF_LINES=32
  # Every env built from this block is a hybrid Arduino-as-ESP-IDF-component
  # build, whose managed component tree includes espressif__esp_modem -- and
  # that genuinely uses C++ exceptions (see exception_stub.hpp). The
  # -fno-exceptions in [common].build_flags (added for the 4MB flash budget,
  # OpenEVSE/openevse_esp32_firmware#1224) reaches the whole IDF build, not
  # just our sources, so esp_modem fails to compile without this. It lives
  # here rather than in each env so a new S3 env cannot forget it; [env]'s
  # `build_unflags = -fexceptions` still has to be cancelled per env. This
  # board is on a 16MB partition, so the flash saving is not wanted anyway.
  # See openevse_wifi_tft_v1, which hit this first.
  -fexceptions
build_partitions = min_spiffs.csv
build_partitions_debug = min_spiffs_debug.csv
build_partitions_16mb = openevse_16mb.csv

neopixel_lib = adafruit/Adafruit NeoPixel@1.15.5
ws2812fx_lib = kitesurfer1404/WS2812FX@1.4.7
; LVGL is pinned by release archive rather than a registry spec on purpose: v8.4.0
; is the last v8 release and the v9 uplift is its own piece of work (#1275). The
; PlatformIO dependabot only follows registry specs, so this stops it re-proposing
; every 9.x release; bump the tag here when the uplift lands.
lvgl_lib = https://github.com/lvgl/lvgl/archive/refs/tags/v8.4.0.zip

gfx_display_libs =
#  ${common.lvgl_lib}
  bodmer/TFT_eSPI@^2.5.43
  SPI

# TFT panel hardware (ILI9488 driver, pins, SPI) WITHOUT enabling any on-device
# renderer. Shared by the legacy TFT_eSPI renderer and the LVGL renderer.
gfx_display_hw_flags =
  -D USER_SETUP_LOADED
  -D ILI9488_DRIVER
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_BL=27
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TOUCH_CS=33
#  -D LOAD_GLCD
#  -D LOAD_FONT2
#  -D LOAD_FONT4
#  -D LOAD_FONT6
#  -D LOAD_FONT7
#  -D LOAD_FONT8
  -D LOAD_GFXFF
#  -D SMOOTH_FONT
#  -D SPI_FREQUENCY=15999999
#  -D SPI_FREQUENCY=20000000
#  -D SPI_FREQUENCY=27000000
  -D SPI_FREQUENCY=40000000
#  -D SPI_FREQUENCY=55000000
#  -D SPI_FREQUENCY=65000000
#  -D SPI_FREQUENCY=80000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=600000

# Same ILI9488 panel on the ESP32-S3 LCD board, on that board's pins.
# Kept separate from gfx_display_hw_flags rather than overriding it, because the
# differences are not just pin numbers:
#  - TFT_MISO=13: in the strapped mode (IM[2:0]=111) the panel's SDA and SDO are one
#    combined bidirectional pin, so readback rides on SDA and there is no real MISO
#    to give TFT_eSPI. (The bus is not inherently write-only -- an ID check is a raw
#    half-duplex spi_master read on MOSI, outside the panel driver.)
#
#    It nevertheless CANNOT be -1, however much the pin map says otherwise. Setting
#    it to -1 boot-loops the board: TFT_eSPI::init() -> writecommand() -> the very
#    first SPIClass::transfer() spins in spiTransferByteNL on `while(cmd.usr)` until
#    the 5 s task watchdog aborts, forever. Re-confirmed on hardware 2026-09-23
#    (board e52c) against the identical image with only this flag changed, so it is
#    the flag and nothing else. The mechanism is NOT the MISO=-1 -> TFT_MOSI alias in
#    Processors/TFT_eSPI_ESP32.h -- that one is guarded to the S2 and C3 -- and is
#    still unexplained; do not "fix" this line on the strength of the schematic.
#
#    IO13 is the FSPI MISO IO_MUX pin and is unconnected on every board revision, so
#    naming it here costs nothing: it is only ever driven as an input.
#  - no TOUCH_CS: the panel is behind a sealed cover and has no touch layer.
#  - TFT_RST is a real pin here, so the panel can be re-inited without a reboot --
#    a failed init is recoverable in software on this board, unlike v1.0.2.
# IO10/11/12 are the FSPI IO_MUX pins, so the bus bypasses the GPIO matrix and can
# clock high; that was a deliberate board decision. 40 MHz ships until 80 is measured
# on real hardware -- see docs/hardware/esp32-s3-lcd.md (the 80 MHz result decides
# whether v1.3 needs 33R series termination, which it currently has nowhere).
gfx_display_hw_flags_s3_lcd =
  -D USER_SETUP_LOADED
  -D ILI9488_DRIVER
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_BL=15
  # AO3400A N-channel low-side gate with a 10k pulldown: active HIGH, off at reset.
  # TFT_eSPI defaults this to HIGH, so it would work by accident -- but on v1.2 the
  # backlight is a known hardware defect (LEDA on 3V3 instead of VBUS, ~20mA against
  # 110mA typ), and nobody debugging a dim panel should also have to derive polarity.
  -D TFT_BACKLIGHT_ON=HIGH
  -D TFT_MISO=13
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_CS=10
  -D TFT_DC=14
  -D TFT_RST=21
  # Core 3.x defines FSPI=0 on the S3 and IDF's REG_SPI_BASE(0) evaluates to 0, so
  # TFT_eSPI's default port (SPI_PORT = FSPI) aims every SPI register write at
  # address 0x10 and the first writecommand() faults. USE_FSPI_PORT makes the
  # library use SPI_PORT=2 (the real GPSPI2 base) while still opening SPIClass(FSPI).
  -D USE_FSPI_PORT
  -D LOAD_GFXFF
  # 40 MHz, and there is no point asking for more. The ESP32-S3 divides an
  # 80 MHz APB and the divider search starts at clkcnt_n=1, so the fastest
  # DIVIDED clock is 80/2 = 40 MHz; SPI_CLK_EQU_SYSCLK is only taken for a
  # request of >=80 MHz. Anything in between silently becomes 40 -- measured:
  # a 65 MHz build reported byte-for-byte identical throughput to 40.
  #
  # 80 MHz WAS TRIED ON HARDWARE (2026-09-24, board e514) AND GARBLES THE
  # PANEL -- and the cause is the ILI9488, not the board. Re-tested at 80 MHz
  # with the SPI pads at GPIO_DRIVE_CAP_0 (~5 mA, slowest edges, which is
  # functionally what series termination buys): still garbled. Meanwhile the
  # ESP32 side was demonstrably fine -- 6171 KB/s and 75 ms per full frame,
  # exactly the predicted 46 ms of wire plus ~29 ms of CPU -- so the bytes go
  # out correctly and the panel does not decode them.
  #
  # The ILI9488's serial write cycle is specified around 50 ns (~20 MHz), so
  # 40 MHz is already 2x spec and works; 80 MHz is 4x and does not. Series
  # termination on v1.7 was considered and dropped on this evidence.
  # See TFT_SPI_DRIVE_CAP in src/lvgl_tft/lvgl_panel.cpp to repeat the test.
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000

# LVGL renderer (src/lcd_lvgl.cpp, src/lvgl_tft/). This is the renderer for the
# stock ILI9488 TFT — the openevse_wifi_tft_v1.* envs default it on via this
# fragment. TFT_eSPI is still the low-level ILI9488 SPI driver underneath.
lvgl_tft_renderer_flags =
  -D ENABLE_SCREEN_LVGL_TFT
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_CONF_SUPPRESS_DEFINE_CHECK
  -D LCD_BACKLIGHT_TIMEOUT_DEFAULT=600  # idle-timeout default for the LVGL TFT (seconds)
  -I src/lvgl_tft

[env]
# specify exact Arduino ESP SDK version, requires platformio 3.5+ (curently dev version)
# http://docs.platformio.org/en/latest/projectconf/section_env_general.html#platform
#platform = https://github.com/platformio/platform-espressif32.git#feature/stage
#platform = https://github.com/platformio/platform-espressif32.git#develop
#platform = espressif32@1.11.1
platform = espressif32@7.1.3
#framework = arduino, espidf
framework = arduino
lib_deps = ${common.lib_deps}
lib_ignore = ${common.lib_ignore}
build_flags = ${common.build_flags}
; The Arduino-ESP32 framework builder unconditionally adds -fexceptions to
; CXXFLAGS. Nothing in this codebase or its libs (checked: ArduinoJson,
; ArduinoMongoose, MicroOcpp, ConfigJson, OpenEVSE, Adafruit GFX) throws or
; catches, so paying for unwind tables buys nothing -- and they're not free:
; on openevse_wifi_v1 they're ~106KB (5.4% of the 4MB partition) baked into
; .flash.rodata, one entry per function. Removing them recovers that flash
; directly and, on top, roughly triples the effective savings of any change
; that removes/simplifies code, since fewer functions means fewer unwind
; entries too. See OpenEVSE/openevse_esp32_firmware#1224 for the flash-budget
; context this was measured against.
build_unflags = -fexceptions
#upload_port = openevse.local
upload_speed = 921600
extra_scripts = ${common.extra_scripts}
board_build.partitions = ${common.build_partitions}
#platform_packages =
#  ; use a special branch
#  framework-arduinoespressif32 @ https://github.com/marcovannoord/arduino-esp32.git#idf-release/v4.0
#    platformio/framework-arduinoespressif32 @ ~3.10006.0
monitor_speed = 115200
monitor_filters =
  esp32_exception_decoder

[env:nodemcu-32s]
board = nodemcu-32s
build_flags =
  ${common.build_flags}
  ${common.debug_flags}
  -D WIFI_LED=2
  -D WIFI_LED_ON_STATE=LOW
  -D RAPI_PORT=Serial2

[env:espressif_esp-wrover-kit]
board = esp-wrover-kit
lib_deps =
  ${common.lib_deps}
  ${common.neopixel_lib}
build_flags =
  ${common.build_flags}
  ${common.debug_flags}
  -D WIFI_BUTTON=2
  -D RAPI_PORT=Serial1
  -D NEO_PIXEL_PIN=18
  -D NEO_PIXEL_LENGTH=2
  -D WIFI_PIXEL_NUMBER=1
  -D RED_LED=0
  -D GREEN_LED=2
  -D BLUE_LED=4
  -D RX1=25
  -D TX1=27
#upload_port = openevse.local
#upload_protocol = espota
upload_speed = 2000000
#upload_protocol = ftdi
#debug_tool = ftdi
#board_build.partitions = ${common.build_partitions_debug}

# export PLATFORMIO_UPLOAD_PORT=172.16.0.157
# export PLATFORMIO_UPLOAD_FLAGS="-p 3232"

[env:espressif_esp-wrover-kit_latest]
extends = env:espressif_esp-wrover-kit
platform = espressif32

[env:adafruit_huzzah32_dev]
board = featheresp32
build_flags =
  ${common.build_flags}
  ${common.debug_flags}
  -D WIFI_LED=13
  -D WIFI_LED_ON_STATE=HIGH
  -D WIFI_BUTTON=0
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  -D RAPI_PORT=Serial
  -D DEBUG_PORT=Serial2

[env:adafruit_huzzah32]
board = featheresp32
build_flags =
  ${common.build_flags}
  -D WIFI_LED=13
  -D WIFI_LED_ON_STATE=HIGH
  -D WIFI_BUTTON=0
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  -D RAPI_PORT=Serial
  -D DEBUG_PORT=Serial2

[env:adafruit_featheresp32]
board = featheresp32
build_flags =
  ${common.build_flags}
  ${common.debug_flags}
  -D WIFI_LED=LED_BUILTIN
  -D WIFI_BUTTON=LED_BUILTIN
  -D RAPI_PORT=Serial2
  -D ENABLE_DEBUG_LED

[env:openevse_wifi_v1]
board = esp32dev
lib_deps =
  ${common.lib_deps}
  ${common.neopixel_lib}
  adafruit/Adafruit MCP9808 Library @ 2.0.2
build_flags =
  ${common.build_flags}
  ${common.debug_flags}
  -D NEO_PIXEL_PIN=17
  -D NEO_PIXEL_LENGTH=14
  -D WIFI_PIXEL_NUMBER=1
  -D WIFI_BUTTON=0
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  -D RAPI_PORT=Serial
  -D DEBUG_PORT=Serial1
  -D I2C_SDA=21
  -D I2C_SCL=22
