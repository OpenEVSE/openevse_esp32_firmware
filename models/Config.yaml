  scheduler_start_window:
    type: number
    default: 600
    description: |
      The maximum number of seconds to randomly add/subtract from the a scheduled charge start time, eg a value of 600 will adjust the start time my +/- 10 minutes. This is to help prevent large syncrinised loads when multiple verchiles start charging at the same time.
  is_threephase:
    type: boolean
    description: |
     Needs to be enabled if charging with 3 phases setup for proper calculations
  wizard_passed:
    type: boolean
    description: |
      define if wizard has been passed or not
  default_state:
    type: boolean
    description: |
      OpenEVSE default state when no claims are running ( 0: disabled | 1: active)
  loadsharing_enabled:
    type: boolean
    default: false
    description: |
      Enable local load sharing coordination with other OpenEVSE devices on the same LAN
  loadsharing_group_id:
    type: string
    description: |
      User-defined identifier for the load sharing group. All members must use the same group_id.
  loadsharing_group_max_current:
    type: number
    minimum: 0
    description: |
      Total maximum current available to the group (amps). This is the upstream circuit limit shared by all members.
  loadsharing_safety_factor:
    type: number
    minimum: 0
    maximum: 1
    default: 1.0
    description: |
      Optional safety factor applied to group_max_current (e.g., 0.8 to use 80% of circuit capacity)
  loadsharing_heartbeat_timeout:
    type: integer
    minimum: 5
    maximum: 600
    default: 30
    description: |
      Seconds before a member considers controller allocations stale and engages
      failsafe. Also used by the controller to mark peers offline when no status
      update is received.
  loadsharing_failsafe_mode:
    type: string
    enum:
      - disable
      - safe_current
    default: safe_current
    description: |
      Behavior when peers are unreachable: 'disable' stops charging, 'safe_current' limits to safe current
  loadsharing_failsafe_safe_current:
    type: number
    minimum: 0
    default: 6.0
    description: |
      Safe current (amps) to use when in safe_current failsafe mode. Must not
      exceed loadsharing_group_max_current.
  loadsharing_failsafe_peer_assumed_current:
    type: number
    minimum: 0
    default: 6.0
    description: |
      Conservative assumed current (amps) for offline peers when calculating group allocation
  loadsharing_rotation_interval:
    type: integer
    minimum: 0
    default: 1800
    description: |
      Seconds between equal-priority member rotations when the budget cannot
      cover all minimums. 0 disables rotation. Under scarcity, equal-priority
      peers time-slice so one vehicle is not permanently starved.
  loadsharing_config_version:
    type: integer
    minimum: 0
    default: 0
    readOnly: true
    description: |
      Monotonically increasing version number for load sharing configuration, used for synchronization
  loadsharing_config_updated_at:
    type: integer
    minimum: 0
    readOnly: true
    description: |
      Unix timestamp of last load sharing configuration update, used for conflict resolution
  loadsharing_role:
    type: string
    enum:
      - ''
      - controller
      - member
    default: ''
    description: |
      Role of this device in the load sharing group. Empty string means load sharing is not configured.
      'controller' means this device manages the group and pushes allocations.
      'member' means this device receives allocations from a controller.
  loadsharing_controller_host:
    type: string
    default: ''
    description: |
      Hostname or IP of the controller device. Set automatically on members when the controller pushes config.

  current_shaper_enabled:
    type: boolean
    description: The current shaper is enabled
  current_shaper_min_pause_time:
    type: integer
    description: Minimum time to pause charging before re-enabling after an undercurrent, in seconds
  current_shaper_smoothing_time:
    type: integer
    description: Smoothing time applied to the live power reading, in seconds
  current_shaper_data_maxinterval:
    type: integer
    description: Maximum time allowed between live power readings before the data is considered stale, in seconds
  factory_write_lock:
    type: boolean
    description: Lock the factory settings of the controller against writes
  heartbeat_interval:
    type: integer
    description: Heartbeat supervision interval, in seconds, `0` disables it
  heartbeat_current:
    type: integer
    description: Current the controller falls back to if the heartbeat is lost, in A
  voltage:
    type: integer
    description: Configured supply voltage, in V. `0` means use the measured or default value
  lang:
    type: string
    description: User interface language, empty for the default
  temp_unit:
    type: string
    enum:
      - c
      - f
    description: Temperature unit used by the user interfaces
  lcd_backlight_timeout:
    type: integer
    description: Display idle timeout in seconds. `0` means never
  lcd_network_info:
    type: boolean
    description: Show network information on the display
  lcd_type:
    type: string
    enum:
      - mono
      - rgb
    readOnly: true
    description: Type of LCD fitted. Only present when the controller reports it
  tft_12h_clock:
    type: boolean
    description: Use a 12 hour clock on the TFT display
  tft_theme:
    type: string
    description: TFT display theme, for example `dark`. Only present on builds with a TFT
  tft_brightness:
    type: integer
    minimum: 10
    maximum: 100
    description: TFT active brightness, in %. Only present on builds with a TFT
  tft_standby_brightness:
    type: integer
    minimum: 0
    maximum: 100
    description: TFT standby brightness, in %, `0` turns the screen off. Only present on builds with a TFT
  temp_throttle_enabled:
    type: boolean
    description: Reduce the charge current as the temperature approaches the setpoint
  temp_throttle_setpoint:
    type: integer
    description: Temperature at which throttling starts, in C
  over_temp_shutdown:
    type: integer
    description: Temperature at which the controller shuts down charging, in C. Only present when the controller supports it
  mqtt_sys_query:
    type: boolean
    description: Query the broker `$SYS` topics for status information
  mqtt_certificate_id:
    type: string
    description: Id of the certificate used to verify the MQTT broker
  mqtt_live_pwr:
    type: string
    description: MQTT topic that supplies the live power used by the current shaper
  mqtt_home_battery_soc:
    type: string
    description: MQTT topic that supplies the home battery state of charge
  mqtt_home_battery_power:
    type: string
    description: MQTT topic that supplies the home battery power
  mqtt_vehicle_charge_limit:
    type: string
    description: MQTT topic that supplies the vehicle charge limit
  sntp_dhcp:
