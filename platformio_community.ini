  ${common.lib_deps}
  ${common.neopixel_lib}
build_flags =
  ${common.build_flags}
  ${common.debug_flags}
  -D RAPI_PORT=Serial1
  -D TX1=6
  -D RX1=7
  -D NEO_PIXEL_PIN=8
  -D NEO_PIXEL_LENGTH=1
  -D WIFI_PIXEL_NUMBER=1

