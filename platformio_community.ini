# ───────────────────────── community-supported boards ───────────────────────
# Merged into platformio.ini via [platformio] extra_configs. Anything here is
# contributed/maintained by the community rather than OpenEVSE itself; the
# officially supported boards (env:openevse_wifi_*) live in platformio.ini
# alongside the shared [common]/[env] config these envs also draw on.

[community_common]
# Shared onboard LAN8720 Ethernet PHY wiring, identical on both wt32-eth01
# variants below.
wt32_eth01_eth_flags =
  -D RESET_ETH_PHY_ON_BOOT=1
  -D RX2=5
  -D TX2=17
  -D ETH_PHY_TYPE=ETH_PHY_LAN8720
  -D ETH_PHY_ADDR=1
  -D ETH_PHY_MDC=23
  -D ETH_PHY_MDIO=18
  -D ETH_CLK_MODE=ETH_CLOCK_GPIO0_IN
  -D ETH_PHY_POWER=16

[env:nodemcu-32s]
board = nodemcu-32s
build_flags =
  ${common.build_flags}
  ${common.debug_flags}
  -D WIFI_LED=2
  -D WIFI_LED_ON_STATE=LOW
  -D RAPI_PORT=Serial2

[env:espressif_esp-wrover-kit]
board = esp-wrover-kit
lib_deps =
  ${common.lib_deps}
  ${common.neopixel_lib}
build_flags =
  ${common.build_flags}
  ${common.debug_flags}
  -D WIFI_BUTTON=2
  -D RAPI_PORT=Serial1
  -D NEO_PIXEL_PIN=18
  -D NEO_PIXEL_LENGTH=2
  -D WIFI_PIXEL_NUMBER=1
  -D RED_LED=0
  -D GREEN_LED=2
  -D BLUE_LED=4
  -D RX1=25
  -D TX1=27
#upload_port = openevse.local
#upload_protocol = espota
upload_speed = 2000000
#upload_protocol = ftdi
#debug_tool = ftdi
#board_build.partitions = ${common.build_partitions_debug}

# export PLATFORMIO_UPLOAD_PORT=172.16.0.157
# export PLATFORMIO_UPLOAD_FLAGS="-p 3232"

[env:adafruit_huzzah32_dev]
board = featheresp32
build_flags =
  ${common.build_flags}
  ${common.debug_flags}
  -D WIFI_LED=13
  -D WIFI_LED_ON_STATE=HIGH
  -D WIFI_BUTTON=0
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  -D RAPI_PORT=Serial
  -D DEBUG_PORT=Serial2

[env:adafruit_huzzah32]
board = featheresp32
build_flags =
  ${common.build_flags}
  -D WIFI_LED=13
  -D WIFI_LED_ON_STATE=HIGH
  -D WIFI_BUTTON=0
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  -D RAPI_PORT=Serial
  -D DEBUG_PORT=Serial2

[env:adafruit_featheresp32]
board = featheresp32
build_flags =
  ${common.build_flags}
  ${common.debug_flags}
  -D WIFI_LED=LED_BUILTIN
  -D WIFI_BUTTON=LED_BUILTIN
  -D RAPI_PORT=Serial2
  -D ENABLE_DEBUG_LED

[env:olimex_esp32-gateway-old]
# For hardware older than RevE
board = esp32-gateway
build_flags =
  ${common.build_flags}
  -D WIFI_LED=33
  -D WIFI_LED_ON_STATE=HIGH
  -D WIFI_BUTTON=34
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  -D DEBUG_PORT=Serial
  -D RAPI_PORT=Serial2
  -D ENABLE_WIRED_ETHERNET
# https://github.com/espressif/arduino-esp32/blob/master/libraries/WiFi/examples/ETH_LAN8720/ETH_LAN8720.ino

[env:olimex_esp32-gateway-f]
# For hardware RevF and RevG
# https://github.com/OpenEVSE/ESP32_WiFi_V3.x/blob/master/docs/wired-ethernet.md
board = esp32-gateway
build_flags =
  ${common.build_flags}
  -D WIFI_LED=33
  -D WIFI_LED_ON_STATE=HIGH
  -D WIFI_BUTTON=34
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  -D DEBUG_PORT=Serial
  -D RAPI_PORT=Serial2
  -D ENABLE_WIRED_ETHERNET
  -D RESET_ETH_PHY_ON_BOOT=1
  -D RX2=16
  -D TX2=32
board_build.extra_flags = "-DARDUINO_ESP32_GATEWAY_F"
upload_speed = 921600

[env:olimex_esp32-gateway-e]
# For hardware RevE
# https://github.com/OpenEVSE/ESP32_WiFi_V3.x/blob/master/docs/wired-ethernet.md
extends = env:olimex_esp32-gateway-f
build_flags =
  ${env:olimex_esp32-gateway-f.build_flags}
board_build.extra_flags = "-DARDUINO_ESP32_GATEWAY_E"

[env:olimex_esp32-gateway-e_dev]
extends = env:olimex_esp32-gateway-e
build_flags =
  ${env:olimex_esp32-gateway-e.build_flags}
  ${common.debug_flags}
build_type = debug
board_build.partitions = ${common.build_partitions_debug}

[env:olimex_esp32-gateway-f_dev]
extends = env:olimex_esp32-gateway-f
build_flags =
  ${env:olimex_esp32-gateway-f.build_flags}
  ${common.debug_flags}
build_type = debug
board_build.partitions = ${common.build_partitions_debug}

[env:olimex_esp32-poe-iso]
# Tested against Rev C board
board = esp32-poe-iso
build_flags =
  ${common.build_flags}
  -D WIFI_BUTTON=34
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  -D DEBUG_PORT=Serial
  -D RAPI_PORT=Serial2
  -D ENABLE_WIRED_ETHERNET
  -D RESET_ETH_PHY_ON_BOOT=1
upload_speed = 921600

[env:heltec_esp32-wifi-lora-v2]
board = heltec_wifi_lora_32_V2
build_flags =
  ${common.build_flags}
  -D DEBUG_PORT=Serial
  -D WIFI_LED=25
  -D WIFI_LED_ON_STATE=HIGH
  -D WIFI_BUTTON=2
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  -D RAPI_PORT=Serial1
  -D RX1=25
  -D TX1=27


[env:wt32-eth01]
# For Wireless Tag
board = wt32-eth01
build_flags =
  ${common.build_flags}
  -D WIFI_LED=12
  -D WIFI_LED_ON_STATE=HIGH
  -D WIFI_BUTTON=4
  -D WIFI_BUTTON_PRESSED_STATE=LOW
 # -D DEBUG_PORT=Serial
  -D RAPI_PORT=Serial2
  -D ENABLE_WIRED_ETHERNET
  ${community_common.wt32_eth01_eth_flags}

[env:wt32-eth01-ws2812]
# For Wireless Tag
board = wt32-eth01
lib_deps =
  ${common.lib_deps}
  ${common.neopixel_lib}
  ${common.ws2812fx_lib}
  adafruit/Adafruit MCP9808 Library @ 2.0.2
build_flags =
  ${common.build_flags}
  #-D WIFI_LED=12
  #-D WIFI_LED_ON_STATE=HIGH
  -D NEO_PIXEL_PIN=12
  -D NEO_PIXEL_LENGTH=15
  -D ENABLE_WS2812FX
  -D WIFI_PIXEL_NUMBER=1
  -D WIFI_BUTTON=4
  -D WIFI_BUTTON_PRESSED_STATE=LOW
 # -D DEBUG_PORT=Serial
  -D RAPI_PORT=Serial2
  # If using PN532 RFID reader through I2C
  # Need to comment pin definition for SDA and SCL at .platformio/packages/framework-arduinoespressif32/variants/wt32-eth01/pins_arduino.h
  #-D I2C_SDA=2
  #-D I2C_SCL=4
  #-D ENABLE_PN532
  # If Using MCP9808
  #-D SDA=2
  #-D SCL=4
  #-D ENABLE_MCP9808
  -D ENABLE_WIRED_ETHERNET
  ${community_common.wt32_eth01_eth_flags}

[env:lilygo-t-eth-lite-rtl8201]
# LilyGO T-ETH-Lite ESP32-WROVER-E (RTL8201, 16MB flash, 8MB PSRAM).
# Ethernet pinout: https://github.com/Xinyuan-LilyGO/LilyGO-T-ETH-Series
# Keep the WT32 WS2812 features and Arduino core; adapt the board wiring.
board = esp32dev
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_build.partitions = ${common.build_partitions_16mb}
lib_deps = ${env:wt32-eth01-ws2812.lib_deps}
build_flags =
  ${common.build_flags}
  -D BOARD_HAS_PSRAM
  # No -mfix-esp32-psram-cache-issue: that workaround is only for the rev.1
  # ("ECO V1") PSRAM cache bug, fixed in hardware since rev.3 -- which is what
  # the "-E" in WROVER-E denotes (ESP32-D0WD-V3). Costs flash/speed for no
  # benefit on this module.
  # External WS2812 strip: GPIO14 isn't broken out on this board's headers
  # (P2/P3 only expose GPIO1,2,3,4,15,32,33,35,39; GPIO37/38 exist on the chip
  # but aren't bonded out on a WROVER module); GPIO33 is a free, non-strapping,
  # non-input-only pin. GPIO12 is reserved for Ethernet power.
  -D NEO_PIXEL_PIN=33
  -D NEO_PIXEL_LENGTH=15
  -D ENABLE_WS2812FX
  -D WIFI_PIXEL_NUMBER=1
  # External button between GPIO32 and GND. Was GPIO4, but that collides with
  # I2C_SCL below (PN532/MCP9808 share the bus): LedManagerTask::setup()
  # reconfigures GPIO4 as a plain input for the button, breaking I2C clock
  # generation, so every periodic PN532/MCP9808 poll stalls on an I2C timeout
  # and blocks MicroTasks' single-threaded scheduler -- including RAPI
  # commands from the web UI, causing intermittent lag reacting to it.
  -D WIFI_BUTTON=32
  -D WIFI_BUTTON_PRESSED_STATE=LOW
  # RAPI wired to the OpenEVSE controller via UART0's default pins
  # (TXD=GPIO1, RXD=GPIO3) -- RAPI_PORT=Serial begins with no explicit pins
  # in src/debug.cpp.
  -D RAPI_PORT=Serial
  # DEBUG_PORT must move off Serial: src/debug.cpp defaults DEBUG_PORT to
  # Serial too, and src/main.cpp's loop() unconditionally polls
  # DEBUG_PORT.available()/handle_serial() regardless of ENABLE_DEBUG, which
  # would steal bytes meant for RAPI_PORT on the same physical UART0. Serial2
  # can't use its own default pins here (GPIO16/17 are the WROVER's PSRAM
  # lines), so pin it to two of this board's free header pins instead:
  # GPIO15 (output-capable) for TX2, GPIO35 (input-only, fine for RX2) for RX2.
  # GPIO35 has no internal pull-up, so RX2 needs an external one (e.g. 10k
  # to 3V3). Left floating, noise arrives as stray bytes and handle_serial()'s
  # readStringUntil() (src/main.cpp) can block loop() ~1 s per byte.
  -D DEBUG_PORT=Serial2
  -D TX2=15
  -D RX2=35
  # If using PN532 RFID reader through I2C
  #-D I2C_SDA=2
  #-D I2C_SCL=4
  #-D ENABLE_PN532
  # If Using MCP9808. No -D SDA=/-D SCL= here: this project always passes
  # I2C_SDA/I2C_SCL explicitly to Wire.begin(), and board=esp32dev's
  # pins_arduino.h already declares SDA/SCL for Wire.cpp's own (unused)
  # compile-time default.
  #-D ENABLE_MCP9808
  -D ENABLE_WIRED_ETHERNET
  -D RESET_ETH_PHY_ON_BOOT=1
  -D ETH_PHY_TYPE=ETH_PHY_RTL8201
  -D ETH_PHY_ADDR=0
  -D ETH_PHY_MDC=23
  -D ETH_PHY_MDIO=18
  -D ETH_CLK_MODE=ETH_CLOCK_GPIO0_IN
  -D ETH_PHY_POWER=12

[env:esp32-c3-devkitc-02]
board = esp32-c3-devkitc-02
